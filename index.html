  /* 전 과정 실행 체크박스 — 기본 꺼짐. 켜면 예전처럼 걸린 부서 전부를 카드로 만듭니다. */
  function bindChain(){
    var cb = $("#chainAll");
    if(!cb) return;
    cb.checked = !!state.chain;
    cb.addEventListener("change", function(){
      state.chain = !!cb.checked;
      save();
      showToast(state.chain
        ? "전 과정 실행 켬 — 지시마다 걸린 부서 전부 + 04 취합 카드를 만듭니다"
        : "전 과정 실행 끔 — 지시에 맞는 부서 1~2곳만 카드로 만듭니다");
    });
  }

  function submitInstruction(raw){
    var ctx = parseCtx(raw);
    var res, mode;
    if(picked.length){
      mode = "manual";
      res = { depts: picked.slice().sort().map(function(no){
        return { no:no, score:0, hits:[], why:"직접 지정" };
      }), fallback:false, near:null };
    }else if(state.chain){
      mode = "chain";
      res = { depts: analyzeChain(raw), fallback:false, near:null };
    }else{
      mode = "auto";
      res = route(raw);
    }

    var made = [], skipped = 0;
    res.depts.forEach(function(p){
      var no = p.no;
      /* 같은 지시로 같은 부서 카드가 이미 살아 있으면 건너뜀 */
      var dup = state.tasks.some(function(x){
        return x.dept === no && x.instr === raw && x.status !== "done";
      });
      if(dup){ skipped++; return; }
      var t = makeTask(no, ctx, raw, null);
      if(!t) return;
      t.route = { mode:mode, score:p.score || 0, hits:(p.hits || []).slice(), why:p.why || "", near:res.near ? res.near.no : "" };
      made.push(t);
    });

    if(!made.length){
      showToast(skipped ? "같은 지시로 만든 카드가 이미 보드에 있습니다" : "배정할 부서를 찾지 못했습니다. 부서를 직접 지정해 보세요.");
      return [];
    }
    state.tasks = made.concat(state.tasks);
    state.history = [{ raw: raw, ts: Date.now(), depts: made.map(function(t){ return t.dept; }) }].concat(state.history).slice(0,12);
    save();
    renderAll();
    renderHistory();

    var box = $("#cmdResult");
    if(box){
      var head = mode === "manual" ? "<b>직접 지정</b> — " : mode === "chain" ? "<b>전 과정 실행</b> — " : "<b>자동 배정</b> — ";
      var tail = mode === "chain"
        ? "전 과정(분담→취합→브리핑→리포트) 카드 " + made.length + "장을 만들었습니다."
        : made.length > 1
        ? "지시에 두 부서가 걸려 카드 <b>2장</b>만 만들었습니다."
        : "지시에 맞는 부서 <b>1곳</b>에 카드 1장만 만들었습니다.";
      var chips = made.map(function(t){
        var r = t.route;
        var sc = (mode === "auto" && r.score) ? " · 점수 " + r.score : "";
        var why = (r.hits && r.hits.length) ? " (" + r.hits.join("·") + ")" : (mode === "manual" ? " (직접 지정)" : "");
        return "<span>" + esc(t.dept + " " + t.deptTitle) + esc(sc) + esc(why) + "</span>";
      }).join("");
      var near = (res.near && made.length === 1)
        ? ' <span style="color:#6b8095">' + esc(res.near.no + " " + ((deptByNo(res.near.no) || {}).title || "")) + "도 " + res.near.score + "점 걸렸지만 1순위만 만들었습니다.</span>"
        : "";
      box.innerHTML = head + tail +
        (skipped ? " (이미 있던 " + skipped + "건은 건너뜀)" : "") +
        (res.fallback ? " <b>키워드가 없어 기본 부서(04 총괄)</b>로 보냈습니다." : "") +
        near +
        '<div class="rs-depts">' + chips + "</div>" +
        '<div style="margin-top:4px;color:#6b8095">다른 부서로 보내려면 카드 상단 부서 이름을 눌러 바꾸세요.</div>';
      box.classList.add("is-on");
    }
    showToast(made.length === 1 ? made[0].dept + " " + made[0].deptTitle + " 부서로 배정했습니다" : made.length + "개 부서로 배정했습니다");
    picked = [];
    $$(".pick-chip").forEach(function(c){ c.classList.remove("is-on"); c.setAttribute("aria-pressed","false"); });

    /* PC로 바로 실행 — 켜져 있으면 카드 생성과 동시에 집 PC로 보냅니다 */
    if(pc.auto && made.length){
      if(!pcReady()){
        pcOpen(true);
        setTimeout(function(){ showToast("카드는 만들었습니다. PC 설정에서 토픽을 넣으면 바로 실행됩니다"); }, 20);
      }else{
        showToast("▶ " + made.map(function(t){ return t.dept + " " + t.deptTitle; }).join(", ") + " 부서로 보냅니다");
        made.forEach(function(t){ pcRun(t.id, true); });
      }
    }

    /* 결과는 메인 화면 결과창에 바로 펼칩니다 — 페이지를 옮기지 않습니다 */
    heroSel = "";
    heroAux = "report";
    renderHeroReport();
    var heroBox = $("#heroReport");
    if(heroBox){
      heroBox.classList.remove("is-flash");
      void heroBox.offsetWidth;
      heroBox.classList.add("is-flash");
      setTimeout(function(){ heroBox.classList.remove("is-flash"); }, 1600);
    }
    return made;
  }

  function renderHistory(){
    // hero 아래 최근 지시는 결과 영역만 사용 (별도 UI 없이 토스트/프리셋 유지)
  }

  /* ================= 보드 액션 ================= */
  function findTask(id){
    for(var i=0;i<state.tasks.length;i++){ if(state.tasks[i].id === id) return state.tasks[i]; }
    return null;
  }

  function copyText(text){
    var done = function(ok){
      showToast(ok ? "복사했습니다 — 클로드 코드에 붙여넣으세요" : "복사가 막혔습니다. 카드를 열어 직접 선택하세요");
    };
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(function(){ done(true); }, function(){ fallbackCopy(text, done); });
    } else {
      fallbackCopy(text, done);
    }
  }
  function fallbackCopy(text, done){
    try{
      var ta = document.createElement("textarea");
      ta.value = text;
      ta.setAttribute("readonly","");
      ta.style.position = "fixed";
      ta.style.top = "-1000px";
      document.body.appendChild(ta);
      ta.select();
      var ok = document.execCommand("copy");
      document.body.removeChild(ta);
      done(ok);
    }catch(e){ done(false); }
  }

  function advance(id){
    var t = findTask(id);
    if(!t) return;
    var i = CYCLE.indexOf(t.status);
    t.status = CYCLE[(i + 1) % CYCLE.length];
    t.statusAt = Date.now();
    t.statusWhy = "직접 변경";
    if(t.status !== "wait") t.reject = "";
    save(); renderAll();
    showToast(t.dept + " " + t.title + " → " + statusOf(t.status).label + " (직접 변경)");
  }

  /* 검수 대기 카드: 승인 → 완료 / 반려 → 대기 */
  function approveTask(id){
    var t = findTask(id);
    if(!t) return;
    t.status = "done";
    t.statusAt = Date.now();
    t.statusWhy = "대표님 승인";
    t.approvedAt = Date.now();
    save(); renderAll();
    showToast("승인 — " + t.dept + " " + t.title + "을(를) 완료 칸으로 옮겼습니다");
  }
  function rejectTask(id){
    var t = findTask(id);
    if(!t) return;
    var reason = null;
    try{ reason = window.prompt("반려 사유 (선택) — 비우고 확인을 누르면 사유 없이 대기로 돌립니다", ""); }catch(e){ reason = ""; }
    if(reason === null) return;
    t.status = "wait";
    t.statusAt = Date.now();
    t.statusWhy = "반려 → 대기";
    t.reject = String(reason || "").slice(0,200);
    t.rejectAt = Date.now();
    if(t.pc) t.pc.rejected = true;
    save(); renderAll();
    showToast("반려 — " + t.dept + " " + t.title + "을(를) 대기 칸으로 되돌렸습니다");

      '<label for="sfTool">쓰는 툴 (선택)</label>' +

  function readStaffForm(){
    var f = $("#staffForm");
    if(!f) return null;
    var name = (($('[data-sf="name"]', f) || {}).value || "").trim();
    var task = (($('[data-sf="task"]', f) || {}).value || "").trim();
    var tool = (($('[data-sf="tool"]', f) || {}).value || "").trim();
    return { name:name, task:task, tool:tool };
  }

  function saveStaffForm(){
    var d = DEPTS[current];
    if(!d) return;
    var v = readStaffForm();
    if(!v) return;
    if(!v.name){
      showToast("직원명을 먼저 적어 주세요");
      var nEl = $('[data-sf="name"]', $("#staffForm")); if(nEl) nEl.focus();
      return;
    }
    if(!state.staff) state.staff = staffDefaults();
    if(!Array.isArray(state.staff[d.no])) state.staff[d.no] = [];
    if(staffEditId){
      var s = findStaff(d.no, staffEditId);
      if(!s){ staffFormOpen = false; staffEditId = null; renderDept(current); return; }
      if(s.name !== v.name){
        state.tasks.forEach(function(t){ if(t.dept === d.no && t.staffId === s.id) t.staffName = v.name; });
      }
      s.name = v.name; s.task = v.task; s.tool = v.tool;
      save(); staffFormOpen = false; staffEditId = null;
      renderAll(); renderDept(current);
      showToast(s.name + " 정보를 수정했습니다");
      return;
    }
    var staff = normalizeStaff({ name:v.name, task:v.task, tool:v.tool });
    state.staff[d.no].push(staff);
    save(); staffFormOpen = false; staffEditId = null;
    renderAll(); renderDept(current);
    showToast(d.no + " " + d.title + "에 " + staff.name + " 추가 — 직원 " + staffOf(d.no).length + "명");
  }

  function assignStaffTask(no, id){
    var s = findStaff(no, id), d = deptByNo(no);
    if(!s || !d) return;
    var ctx = { raw: s.name + " 담당 — " + (s.task || d.title), n:0, unit:"", channels:[] };
    var t = makeTask(no, ctx, ctx.raw, s);
    if(!t){ showToast("이 부서는 업무 카드를 만들 수 없습니다"); return; }
    t.title = s.name + " · " + t.title;
    t.route = { mode:"manual", score:0, hits:[], why:"드로어에서 직접 배정", near:"" };
    state.tasks = [t].concat(state.tasks);
    save(); renderAll(); renderDept(current);
    showToast(s.name + "에게 업무 카드를 만들어 보드에 올렸습니다");
  }

  function deleteStaff(no, id){
    var s = findStaff(no, id);
    if(!s) return;
    var n = tasksOfStaff(no, id);
    if(n && !window.confirm(s.name + "에게 배정된 카드 " + n + "건은 '미배정'으로 돌아갑니다. 직원을 삭제할까요?")) return;
    state.staff[no] = staffOf(no).filter(function(x){ return x.id !== id; });
    state.tasks.forEach(function(t){
      if(t.dept === no && t.staffId === id){ t.staffId = ""; t.staffName = ""; }
    });
    if(staffEditId === id){ staffEditId = null; staffFormOpen = false; }
    save(); renderAll(); renderDept(current);
    showToast(s.name + "을(를) " + no + " 부서에서 삭제했습니다");
  }

    html += '<section class="dw-sec"><h3><i></i>부서 정보 수정</h3><div class="dept-edit">' +

      '<label>분류<select data-da="cat">' + CATS.map(function(c){ return '<option value="' + c.k + '"' + (c.k === d.cat ? " selected" : "") + '>' + c.n + '</option>'; }).join("") + '</select></label>' +
      '<label>자동 배정 키워드 (쉼표)<input data-da="kw" type="text" maxlength="180" autocomplete="off" placeholder="예) 블로그, 포스팅, 원고" value="' + esc(deptKwText(d)) + '"></label>' +
      '<label>산출물 (쉼표)<input data-da="outputs" type="text" maxlength="180" autocomplete="off" value="' + esc((d.outputs || []).join(", ")) + '"></label>' +
      '<div class="de-row"><button type="button" class="save" data-dept-act="save">부서 정보 저장</button>' +

    html += '</ul></section>';
    html += '<section class="dw-sec"><h3><i></i>쓰는 툴</h3><div class="tools-grid">';

    html += '</div></section>';

    html += '</div>';

    html += '</section>';
    html += '<section class="dw-sec" style="margin-bottom:6px"><h3><i></i>연결되는 곳</h3><p class="dw-linkage">' + esc(d.link) + '</p></section>';

  function openDept(i){
    lastFocus = document.activeElement;
    staffFormOpen = false; staffEditId = null;
    renderDept(i);
    drawer.hidden = false;
    document.body.style.overflow = "hidden";
    var c = $(".dw-close", drawer);

  function closeDept(){

    document.body.style.overflow = "";
    if(lastFocus && lastFocus.focus) lastFocus.focus();
  }

  $$("[data-close]", drawer).forEach(function(el){ el.addEventListener("click", closeDept); });
  $("#dwPrev").addEventListener("click", function(){ staffFormOpen = false; staffEditId = null; renderDept((current + DEPTS.length - 1) % DEPTS.length); });
  $("#dwNext").addEventListener("click", function(){ staffFormOpen = false; staffEditId = null; renderDept((current + 1) % DEPTS.length); });
  $("#dwCopy").addEventListener("click", function(){
    var d = DEPTS[current];
    var tf = tplFor(d.no);
    var t = tf ? tf({ raw: d.title + " 상시 업무", n:0, unit:"", channels:[] }) : null;
    var st = staffOf(d.no)[0];
    copyText(t ? wrapPrompt(d.no, d.title, st ? st.name : "", t.prompt) : d.title);
  });
  $("#dwAdd").addEventListener("click", function(){
    var d = DEPTS[current];
    var ctx = { raw: d.title + " 상시 업무 — 보드에서 직접 추가", n:0, unit:"", channels:[] };

      t.route = { mode:"manual", score:0, hits:[], why:"부서에서 직접 추가", near:"" };
      state.tasks = [t].concat(state.tasks);

      showToast(d.no + " " + d.title + " 업무를 보드에 추가했습니다");

  });
  /* 부서 정보 저장·삭제 (드로어 내부) */
  dwBody.addEventListener("click", function(e){
    var btn = e.target.closest ? e.target.closest("[data-dept-act]") : null;

    var act = btn.getAttribute("data-dept-act");

  /* 직원 추가·수정·삭제·배정 (드로어 내부) */
  dwBody.addEventListener("click", function(e){
    var btn = e.target.closest ? e.target.closest("[data-staff-act]") : null;
    if(!btn) return;
    var act = btn.getAttribute("data-staff-act");
    var d = DEPTS[current];
    if(!d) return;
    if(act === "add-toggle"){
      staffFormOpen = !staffFormOpen; staffEditId = null;
      renderDept(current);
      var f = staffFormOpen ? $('[data-sf="name"]', $("#staffForm")) : null;
      if(f) f.focus();
      return;

      staffFormOpen = true; staffEditId = btn.getAttribute("data-staff-id");
      renderDept(current);
      var g = $('[data-sf="name"]', $("#staffForm"));
      if(g){ g.focus(); g.select(); }
      return;
    }
    if(act === "cancel"){ staffFormOpen = false; staffEditId = null; renderDept(current); return; }
    if(act === "save"){ saveStaffForm(); return; }
    var sid = btn.getAttribute("data-staff-id");
    if(act === "assign") assignStaffTask(d.no, sid);
    else if(act === "del") deleteStaff(d.no, sid);
  });
  dwBody.addEventListener("keydown", function(e){
    if(e.key !== "Enter") return;
    var t = e.target;
    if(!t || !t.getAttribute || !t.getAttribute("data-sf")) return;
    e.preventDefault();
    saveStaffForm();
  });

  document.addEventListener("keydown", function(e){
    if(drawer.hidden) return;
    if(e.key === "Escape"){
      if(staffFormOpen){ staffFormOpen = false; staffEditId = null; renderDept(current); return; }
      closeDept();
    }
    var tag = (e.target && e.target.tagName) || "";
    if(tag === "INPUT" || tag === "TEXTAREA") return;
    if(e.key === "ArrowLeft"){ staffFormOpen = false; staffEditId = null; renderDept((current + DEPTS.length - 1) % DEPTS.length); }
    if(e.key === "ArrowRight"){ staffFormOpen = false; staffEditId = null; renderDept((current + 1) % DEPTS.length); }
    if(e.key === "Tab"){
      var f = $$('button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])', drawer).filter(function(el){ return el.offsetParent !== null; });
      if(!f.length) return;
      var first = f[0], last = f[f.length-1];
      if(e.shiftKey && document.activeElement === first){ e.preventDefault(); last.focus(); }
      else if(!e.shiftKey && document.activeElement === last){ e.preventDefault(); first.focus(); }
    }
  });

  /* ================= 필터 / 이벤트 ================= */
  $$(".tab[data-filter]").forEach(function(tab){
    tab.addEventListener("click", function(){
      $$(".tab[data-filter]").forEach(function(t){ t.classList.remove("is-active"); t.setAttribute("aria-selected","false"); });
      tab.classList.add("is-active"); tab.setAttribute("aria-selected","true");
      voApplyFilter();
    });
  });

  $("#cmdForm").addEventListener("submit", function(e){
    e.preventDefault();
    var raw = ($("#cmdText").value || "").trim();
    if(!raw){
      showToast("지시를 한 줄 적어주세요");
      $("#cmdText").focus();
      return;
    }
    submitInstruction(raw);
  });

  $("#cmdForm").addEventListener("reset", function(){
    setTimeout(function(){
      picked = [];
      $$(".pick-chip").forEach(function(c){ c.classList.remove("is-on"); c.setAttribute("aria-pressed","false"); });
      var box = $("#cmdResult");
      if(box) box.classList.remove("is-on");
    }, 0);
  });

  $$("[data-preset]").forEach(function(btn){
    btn.addEventListener("click", function(){
      var ta = $("#cmdText");
      ta.value = btn.getAttribute("data-preset");
      ta.focus();
    });
  });

  document.addEventListener("click", function(e){
    var pick = e.target.closest ? e.target.closest(".pick-chip") : null;
    if(pick){
      var no = pick.getAttribute("data-pick");
      var i = picked.indexOf(no);
      if(i > -1) picked.splice(i,1); else picked.push(no);
      pick.classList.toggle("is-on", i < 0);
      pick.setAttribute("aria-pressed", i < 0 ? "true" : "false");
      return;
    }
    var btn = e.target.closest ? e.target.closest("[data-act]") : null;
    if(!btn) return;
    var card = btn.closest(".task");
    if(!card) return;
    var id = card.getAttribute("data-id");
    var act = btn.getAttribute("data-act");
    var t = findTask(id);
    if(act === "pccopy" && t && t.pc){
      var pv = t.pc.view || "full";
      var pr = parseResult(t.pc.text || "");
      copyText(pv !== "full" && pr.map[pv] ? pr.map[pv] : (t.pc.text || ""));
    }
    else if(act === "pcsec" && t && t.pc){ t.pc.view = btn.getAttribute("data-sec") || "full"; save(); renderBoard(); }
    else if(act === "pcview" && t && t.pc){ t.pc.open = !t.pc.open; save(); renderBoard(); }
    else if(act === "pcrun"){ pcRun(id); }
    else if(act === "copy" && t){ copyText(promptOf(t)); }
    else if(act === "open" && t){ openDept(DEPTS.map(function(d){ return d.no; }).indexOf(t.dept)); }
    else if(act === "adv"){ advance(id); }
    else if(act === "approve"){ approveTask(id); }
    else if(act === "reject"){ rejectTask(id); }
    else if(act === "del"){ removeTask(id); }
  });

  /* 카드에서 담당 직원 바로 바꾸기 */
  var boardGrid = $("#boardGrid");
  if(boardGrid){
    boardGrid.addEventListener("change", function(e){
      var card = e.target.closest ? e.target.closest(".task") : null;
      if(!card) return;
      var t = findTask(card.getAttribute("data-id"));
      if(!t) return;

      /* 카드 상단 부서 드롭다운 → 내용·직원·전송 문구까지 다시 만듬 */
      var dsel = e.target.closest ? e.target.closest("select[data-dept-sel]") : null;
      if(dsel){
        if(dsel.value && dsel.value !== t.dept) retargetTask(t.id, dsel.value);
        else renderBoard();
        return;
      }

      /* 검수 필요 체크 */
      var rev = e.target.closest ? e.target.closest("input[data-review]") : null;
      if(rev){
        t.review = !!rev.checked;
        save(); renderBoard();
        showToast(t.review ? "검수 필요 켬 — 결과가 오면 검수 대기 칸으로 갑니다" : "검수 필요 꺼짐 — 결과가 오면 완료 칸으로 갑니다");
        return;
      }

      var sel = e.target.closest ? e.target.closest("select[data-staff-sel]") : null;
      if(!sel) return;
      var v = sel.value || "";
      if(!v){ t.staffId = ""; t.staffName = ""; }
      else {
        var s = findStaff(t.dept, v);
        t.staffId = s ? s.id : "";
        t.staffName = s ? s.name : (t.staffName || "");
      }
      save(); renderAll();
      showToast(t.staffId ? "담당을 " + staffNameOf(t) + "(으)로 바꿨습니다" : "담당을 미배정으로 돌렸습니다");
    });
  }

  /* 결과 보고함 — 목록 선택 · 필터 · 섹션 탭 · 복사/저장/승인/반려 */

    var pr = parseResult((t.pc && t.pc.text) || "");

  /* ==================================================================
     집 PC 연결 — butter_agent.py(ntfy 브릿지) 와 실제로 주고받기
     · 설정(수신/응답 토픽)은 이 브라우저 localStorage 에만 저장합니다.
       (공개 저장소 index.html 에는 어떤 토픽·비밀값도 적지 않습니다)
     ================================================================== */
  var PCSTORE = "vision_console_pc_v1";
  var PC_WAIT = 12000;          /* 연결 확인 대기 시간(ms) */
  var PC_MAX_BYTES = 3800;      /* ntfy 메시지 4KB 한도 */
  var pc = { "in":"", out:"", auto:true, live:"off", note:"", lastOk:0 };
  var pcES = null, pcPollTimer = null, pcRetryTimer = null;
  var pcSince = 0, pcSeen = {}, pcSeenN = 0, pcPending = {};

  function pcTopic(v){
    var s = String(v == null ? "" : v).trim();
    if(!s) return "";
    s = s.replace(/^ntfy:\/\//i, "").replace(/^https?:\/\/[^\/]+\/?/i, "");
    s = s.split(/[?#]/)[0].replace(/^\/+/, "").replace(/\/+$/, "");
    return s;
  }
  function pcTopicOk(s){ return /^[-_A-Za-z0-9]{1,64}$/.test(String(s || "")); }
  function pcReady(){ return pcTopicOk(pc["in"]) && pcTopicOk(pc.out); }
  function pcUrl(topic, tail){ return "https://ntfy.sh/" + encodeURIComponent(topic) + (tail || ""); }
  function pcNewId(){ return "vc" + Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }

  function pcBytes(s){
    try{ return new TextEncoder().encode(s).length; }catch(e){}
    try{ return encodeURIComponent(String(s)).replace(/%[0-9A-F]{2}/gi, "x").length; }catch(e){ return String(s).length; }
  }
  function pcTrim(s, max){
    s = String(s || "");
    if(pcBytes(s) <= max) return s;
    var tail = "\n\n(… 이하 생략 — 길어서 잘랐습니다)";
    var room = max - pcBytes(tail);
    if(room < 16) return s.slice(0, Math.max(0, max));
    var lo = 0, hi = s.length;
    while(lo < hi){
      var mid = (lo + hi + 1) >> 1;
      if(pcBytes(s.slice(0, mid)) <= room) lo = mid; else hi = mid - 1;
    }
    return s.slice(0, lo) + tail;
  }
  function pcSecsText(sec){
    sec = Math.max(0, Math.round(sec || 0));
    if(sec < 60) return sec + "초";
    return Math.floor(sec / 60) + "분 " + (sec % 60) + "초";
  }

  /* ---------- 저장 / 불러오기 ---------- */
  function pcLoad(){
    try{
      var raw = localStorage.getItem(PCSTORE);
      if(!raw) return;
      var s = JSON.parse(raw);
      if(!s || typeof s !== "object") return;
      pc["in"] = pcTopic(s["in"]);
      pc.out = pcTopic(s.out);
      if(typeof s.auto === "boolean") pc.auto = s.auto;
    }catch(e){}
  }
  function pcStore(){
    try{ localStorage.setItem(PCSTORE, JSON.stringify({ "in":pc["in"], out:pc.out, auto:pc.auto })); }catch(e){}
    syncAfterSave();
  }

  /* ---------- base64url (#connect= 해시) ---------- */
  function pcB64Txt(s){
    var enc = encodeURIComponent(String(s)), bin = "", i = 0;
    while(i < enc.length){
      if(enc.charAt(i) === "%"){ bin += String.fromCharCode(parseInt(enc.substr(i + 1, 2), 16)); i += 3; }
      else { bin += enc.charAt(i); i += 1; }
    }
    return btoa(bin).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
  }
  function pcTxtB64(s){
    s = String(s || "").replace(/-/g, "+").replace(/_/g, "/");
    while(s.length % 4) s += "=";
    var bin = atob(s), esc2 = "", i = 0;
    for(i = 0; i < bin.length; i++){ esc2 += "%" + ("0" + bin.charCodeAt(i).toString(16)).slice(-2); }
    try{ return decodeURIComponent(esc2); }catch(e){ return bin; }
  }

  /* #connect=BASE64URL({"in":..,"out":..})  또는  #connect=in=..&out=..  또는  #connect={"in":..,"out":..} */
  function pcReadHash(){
    var h = String(location.hash || "");
    /* #sync=보드코드 — 공유 보드만 맞추는 짧은 링크 */
    if(h.indexOf("#sync=") === 0){
      var sc0 = "";
      try{ sc0 = decodeURIComponent(h.slice(6)); }catch(e){ sc0 = h.slice(6); }
      sc0 = String(sc0 || "").toLowerCase().replace(/[^a-z0-9]/g, "").slice(0, 24);
      if(!sc0) return false;
      try{ localStorage.setItem(SYNC_CODE, sc0); }catch(e){}
      try{ history.replaceState(null, "", location.pathname + location.search); }
      catch(e){ location.hash = ""; }
      return true;
    }
    if(h.indexOf("#connect=") !== 0) return false;
    var raw = h.slice(9);
    if(!raw) return false;
    try{ raw = decodeURIComponent(raw); }catch(e){}
    var cfg = null, q = {};
    if(raw.indexOf("in=") > -1 || raw.indexOf("out=") > -1){
      raw.split("&").forEach(function(kv){
        var i = kv.indexOf("=");
        if(i < 0) return;
        var k = kv.slice(0, i).replace(/^\?/, ""), v = kv.slice(i + 1);
        try{ v = decodeURIComponent(v); }catch(e){}
        q[k] = v;
      });
      cfg = { "in": q["in"] || q.in_topic || q.i || "", out: q.out || q.out_topic || q.o || "" };
    }else{
      var txt = raw;
      if(txt.charAt(0) !== "{"){ try{ txt = pcTxtB64(raw); }catch(e){ txt = ""; } }
      try{
        var o = JSON.parse(txt);
        if(o && typeof o === "object"){
          cfg = { "in": o["in"] || o.in_topic || o.i || "", out: o.out || o.out_topic || o.o || "" };
        }
      }catch(e){ cfg = null; }
    }
    if(!cfg) return false;
    var inT = pcTopic(cfg["in"]), outT = pcTopic(cfg.out);
    var sc1 = String(cfg.s || "").toLowerCase().replace(/[^a-z0-9]/g, "").slice(0, 24);
    if(sc1){ try{ localStorage.setItem(SYNC_CODE, sc1); }catch(e){} }
    if(!pcTopicOk(inT) || !pcTopicOk(outT)){
      if(sc1){
        try{ history.replaceState(null, "", location.pathname + location.search); }
        catch(e){ location.hash = ""; }
        return true;
      }
      return false;
    }
    pc["in"] = inT; pc.out = outT; pc.auto = true; pc.live = "off"; pc.note = "";
    pcStore();
    /* 주소창에서 해시 제거 — #board 같은 다른 탭 이동과 부딪히지 않게 */
    try{ history.replaceState(null, "", location.pathname + location.search); }
    catch(e){ location.hash = ""; }
    return true;
  }

  /* ---------- 화면(헤더 배지·설정 모달) ---------- */
  function pcAgo(ts){
    var d = Date.now() - (ts || 0);
    if(d < 15000) return "방금";
    if(d < 60000) return Math.round(d / 1000) + "초 전";
    if(d < 3600000) return Math.round(d / 60000) + "분 전";
    return Math.round(d / 3600000) + "시간 전";
  }

  function renderPC(){
    var live = pcReady() ? pc.live : "off";
    var pill = $("#pcPill"), txt = $("#pcPillTxt");
    if(pill){
      pill.setAttribute("data-live", live);
      pill.title = live === "on"
        ? "집 PC 연결됨 — 눌러서 다시 확인"
        : live === "checking"
        ? "집 PC 응답을 기다리는 중"
        : "집 PC가 연결되어 있지 않습니다 — 눌러서 토픽 설정";
    }
    if(txt){
      txt.textContent = live === "on" ? "🟢 집 PC 연결됨" : live === "checking" ? "🟡 확인 중" : "⚪ PC 미연결";
    }
    var st = $("#pcState");
    if(st){
      st.setAttribute("data-live", live);
      if(!pcReady()){
        st.innerHTML = "아직 토픽이 없습니다. 위 두 칸을 채우고 <b>저장</b>을 누르세요.";
      }else if(live === "checking"){
        st.innerHTML = "<b>확인 중…</b> 집 PC 응답을 " + Math.round(PC_WAIT / 1000) + "초 기다립니다.";
      }else if(live === "on"){
        st.innerHTML = "<b>🟢 연결됨</b> — " + esc(pc.note || "집 PC가 응답했습니다.") +
          (pc.lastOk ? ' <span style="opacity:.7">(' + esc(pcAgo(pc.lastOk)) + ")</span>" : "");
      }else{
        st.innerHTML = "<b>⚪ 응답 없음</b> — " + esc(pc.note || "집 PC에서 버터 연결 프로그램(butter_agent.py)이 켜져 있는지 확인하세요.");
      }
    }
    pcSwitchSync();
  }

  function pcSwitchSync(){
    var sw = $("#pcAuto"), wrap = $("#pcAutoWrap");
    if(!sw) return;
    sw.checked = !!pc.auto;
    if(wrap){
      wrap.classList.toggle("is-off", !pc.auto);
      wrap.title = pcReady()
        ? "지시를 넣으면 카드가 만들어지면서 집 PC 클로드 코드로 바로 전송됩니다"
        : "PC 설정에서 수신·응답 토픽을 먼저 넣어 주세요";

  }

  function pcOpen(focusFirst){
    var m = $("#pcModal");
    if(!m) return;
    var i1 = $("#pcIn"), i2 = $("#pcOut");
    if(i1 && (i1.value === "" || document.activeElement !== i1)) i1.value = pc["in"];
    if(i2 && (i2.value === "" || document.activeElement !== i2)) i2.value = pc.out;
    m.hidden = false;
    document.body.style.overflow = "hidden";
    renderPC();
    if(focusFirst && i1) setTimeout(function(){ try{ i1.focus(); i1.select(); }catch(e){} }, 40);

  function pcClose(){

    if(!m) return;
    m.hidden = true;

  }

  function pcFormValues(){
    var i1 = $("#pcIn"), i2 = $("#pcOut");
    return { "in": pcTopic(i1 ? i1.value : ""), out: pcTopic(i2 ? i2.value : "") };
  }
  function pcApplyForm(){
    var v = pcFormValues();
    if(!v["in"] || !v.out){
      pc.note = "두 칸을 모두 채워 주세요.";
      renderPC();
      showToast("수신·응답 토픽을 모두 넣어 주세요");
      return false;
    }
    if(!pcTopicOk(v["in"]) || !pcTopicOk(v.out)){
      pc.note = "토픽 이름에는 영문·숫자·-·_ 만 쓸 수 있습니다.";
      renderPC();
      showToast("토픽 이름을 확인해 주세요");
      return false;
    }
    var changed = (v["in"] !== pc["in"]) || (v.out !== pc.out);
    pc["in"] = v["in"]; pc.out = v.out; pc.note = "";
    if(changed){ pc.live = "off"; pc.lastOk = 0; pcResetSub(); }
    pcStore();
    renderPC();
    return true;
  }

  /* ---------- 연결 확인 (/status) ---------- */
  function pcCheck(){
    if(!pcReady()){ renderPC(); return; }
    pc.live = "checking"; pc.note = "";
    renderPC();
    var id = pcNewId();
    var timer = setTimeout(function(){
      var req = pcPending[id];
      if(!req) return;
      delete pcPending[id];
      if(pc.live === "checking"){
        pc.live = "off";
        pc.note = "12초 동안 응답이 없습니다. 집 PC 전원·인터넷·연결 프로그램을 확인하세요.";
        renderPC();
      }
    }, PC_WAIT);
    pcPending[id] = { kind:"check", timer:timer };
    pcPost(id, "/status", function(err){
      if(!err) return;
      var req = pcPending[id];
      if(req && req.timer) clearTimeout(req.timer);
      delete pcPending[id];
      pc.live = "off";
      pc.note = "전송 실패: " + (err.message || err);
      renderPC();
    });
  }

  /* ---------- 보내기 ---------- */
  function pcPost(id, text, cb){
    if(!pcReady()){ cb(new Error("토픽이 설정되지 않았습니다")); return; }
    pcSub();
    var body = JSON.stringify({ id:id, text:text });
    var timer = setTimeout(function(){ cb(new Error("보내는 데 시간이 너무 걸립니다")); }, 20000);
    fetch(pcUrl(pc["in"]), {
      method:"POST",
      headers:{ "Content-Type":"text/plain; charset=utf-8" },
      body:body,
      cache:"no-store"
    }).then(function(r){
      clearTimeout(timer);
      if(r.ok) return true;
      if(r.status === 413) throw new Error("지시문이 ntfy 한도(4KB)를 넘었습니다");
      if(r.status === 429) throw new Error("잠시 뒤 다시 시도해 주세요(요청 한도)");
      throw new Error("HTTP " + r.status);
    }).then(function(){ cb(null); })
      .catch(function(e){ clearTimeout(timer); cb(e || new Error("전송 실패")); });
  }

  /* ---------- 받기 (SSE 우선, 실패하면 5초 폴링) ---------- */
  function pcResetSub(){
    if(pcES){ try{ pcES.close(); }catch(e){} pcES = null; }
    pcStopPoll();
    clearTimeout(pcRetryTimer);
    pcSince = 0; pcSeen = {}; pcSeenN = 0;
  }
  function pcSub(){
    if(!pcReady() || pcES || pcPollTimer) return;
    if(typeof EventSource === "undefined"){ pcPoll(); return; }
    var since = pcSince || (Math.floor(Date.now() / 1000) - 900);
    try{
      pcES = new EventSource(pcUrl(pc.out, "/sse?since=" + since));
    }catch(e){
      pcES = null; pcPoll(); return;
    }
    pcES.onmessage = function(e){ pcFeed(e.data); };
    pcES.onerror = function(){
      if(pcES){ try{ pcES.close(); }catch(e){} pcES = null; }
      pcPoll();
      clearTimeout(pcRetryTimer);
      pcRetryTimer = setTimeout(function(){
        if(pcES) return;
        pcStopPoll();
        pcSub();
      }, 60000);
    };
  }
  function pcStopPoll(){
    if(pcPollTimer){ clearInterval(pcPollTimer); pcPollTimer = null; }
  }
  function pcPoll(){
    if(pcPollTimer || !pcReady()) return;
    pcPollOnce();
    pcPollTimer = setInterval(pcPollOnce, 5000);
  }
  function pcPollOnce(){
    if(!pcReady()){ pcStopPoll(); return; }
    var since = pcSince || (Math.floor(Date.now() / 1000) - 120);
    fetch(pcUrl(pc.out, "/json?poll=1&since=" + since), { cache:"no-store" })
      .then(function(r){ return r.text(); })
      .then(function(t){
        String(t || "").split("\n").forEach(function(line){
          line = line.replace(/^\s+|\s+$/g, "");
          if(line) pcFeed(line);
        });
      })
      .catch(function(){});
  }

  function pcFeed(raw){
    var ev;
    try{ ev = JSON.parse(raw); }catch(e){ return; }
    if(!ev || ev.event !== "message") return;
    if(ev.id){
      if(pcSeen[ev.id]) return;
      pcSeen[ev.id] = 1;
      pcSeenN++;
      if(pcSeenN > 400){ pcSeen = {}; pcSeenN = 0; pcSeen[ev.id] = 1; }
    }
    if(ev.time && ev.time > pcSince) pcSince = ev.time;
    var p;
    try{ p = JSON.parse(ev.message || ""); }catch(e){ return; }
    if(!p || !p.id) return;
    var fresh = !ev.time || ev.time > (Date.now() / 1000 - 300);
    if(fresh && (p.event === "ack" || p.event === "result" || p.event === "error" || p.event === "online" || p.event === "progress")){
      pcAlive();
    }
    var req = pcPending[p.id];
    if(!req) return;
    if(p.event === "progress"){ pcOnProgress(req, p); return; }
    if(p.event === "ack"){ pcOnAck(req, p); return; }
    if(p.event === "result" || p.event === "error"){ pcOnResult(req, p); return; }
  }

  /* PC가 보내는 진행 단계: {"event":"progress","stage":"work","detail":"..."} */
  function pcStageKeyIndex(s){
    var k = String(s == null ? "" : s).toLowerCase().trim();
    var map = { assign:0, plan:0, judge:0, brief:0, "1":0, work:1, do:1, run:1, exec:1, parallel:1, "2":1,
                share:2, insight:2, insights:2, "3":2, confirm:3, review:3, merge:3, collect:3, "4":3,
                report:4, "5":4, done:4, final:4 };
    return map[k] != null ? map[k] : -1;
  }

  function pcOnProgress(req, p){
    if(req.kind !== "task") return;
    var t = findTask(req.taskId);
    if(!t || !t.pc) return;
    if(t.pc.state === "done" || t.pc.state === "error") return;
    if(!t.pc.ackAt) t.pc.ackAt = Date.now();
    t.pc.state = "running";
    t.pc.stageFrom = "event";
    var idx = pcStageKeyIndex(p.stage);
    if(idx < 0 && typeof p.idx === "number") idx = p.idx;
    t.pc.stageIdx = idx;
    t.pc.stageKey = String(p.stage || "");
    t.pc.stageDetail = String(p.detail || "").slice(0, 180);
    t.pc.stageAt = Date.now();
    t.pc.stale = false;
    if(t.status !== "doing"){ t.status = "doing"; t.statusAt = Date.now(); t.statusWhy = "PC 작업 중"; }
    save(); renderBoard(); renderBrief(); renderHeroReport();
  }
  function pcAlive(){
    var was = pc.live;
    pc.live = "on";
    pc.lastOk = Date.now();
    if(was !== "on") renderPC();
  }

  function pcOnAck(req, p){
    if(req.kind !== "task") return;
    var t = findTask(req.taskId);
    if(!t) return;
    if(!t.pc) t.pc = { state:"sent", at:Date.now(), open:false, text:"", secs:0 };
    if(t.pc.state !== "sent") return;
    t.pc.state = "running";
    t.pc.ackAt = Date.now();
    t.pc.note = p.text || "";
    t.pc.stageFrom = "time";
    t.pc.stageIdx = 0;
    t.pc.autoIdx = 0;
    t.pc.stageDetail = "";
    t.pc.stageAt = Date.now();
    /* ack를 받으면 그대로 진행 중 칸에 둡니다 */
    if(t.status !== "doing"){ t.status = "doing"; t.statusAt = Date.now(); t.statusWhy = "PC 작업 중"; }
    save(); renderAll();
  }

  function pcOnResult(req, p){
    req.buf = req.buf || {};
    req.buf[p.part || 1] = String(p.text == null ? "" : p.text);
    var total = p.parts || 1, got = 0, k;
    for(k in req.buf){ if(req.buf.hasOwnProperty(k)) got++; }
    if(got < total) return;
    var full = "";
    for(k = 1; k <= total; k++){ full += (req.buf[k] || ""); }
    delete pcPending[p.id];

    if(req.kind === "check"){
      if(req.timer) clearTimeout(req.timer);
      pc.live = p.event === "error" ? "off" : "on";
      pc.lastOk = Date.now();
      pc.note = full.slice(0, 400);
      renderPC();
      return;
    }
    var t = findTask(req.taskId);
    if(!t) return;
    t.pc = t.pc || {};
    var ok = p.event !== "error";
    t.pc.state = ok ? "done" : "error";
    t.pc.text = full || (ok ? "(빈 결과)" : "클로드 코드가 빈 오류를 돌려줬습니다.");
    t.pc.secs = typeof p.secs === "number" ? p.secs : (t.pc.at ? (Date.now() - t.pc.at) / 1000 : 0);
    t.pc.view = "";
    heroSel = "";
    heroAux = "report";
    t.pc.stageFrom = "event";
    t.pc.stageIdx = 4;
    t.pc.stageKey = "report";
    t.pc.doneAt = Date.now();
    t.pc.open = true;
    t.pc.stale = false;

    /* 결과에 따라 카드가 스스로 칸을 옮깁니다: 오류 → 오류 / 승인·검수 요청 → 검수 대기 / 그 밖 → 완료 */
    var key, why;
    if(!ok){ key = "error"; why = "PC 오류"; }
    else if(needsReview(t, t.pc.text)){ key = "review"; why = t.review ? "검수 필요 체크" : "결과에 승인·확인 요청"; }
    else { key = "done"; why = "PC 완료"; }
    t.status = key;
    t.statusAt = Date.now();
    t.statusWhy = why;
    if(key === "review") t.reject = "";

    save(); renderAll();
    showToast(t.dept + " " + t.deptTitle + " — " + (key === "error" ? "오류가 돌아와 오류 칸으로 옮겼습니다" : key === "review" ? "검수 대기 칸으로 옮겼습니다 (" + why + ")" : "완료 칸으로 옮겼습니다"));
  }

  /* ---------- 카드에서 실행 ---------- */
  function pcRun(taskId, quiet){
    var t = findTask(taskId);
    if(!t) return;
    if(!pcReady()){
      if(!quiet){ pcOpen(true); showToast("먼저 PC 설정에서 수신·응답 토픽을 넣어 주세요"); }
      return;
    }
    if(t.pc && (t.pc.state === "sent" || t.pc.state === "running")){
      if(!quiet) showToast("이미 PC로 보낸 카드입니다 — 결과를 기다리는 중");
      return;
    }
    var id = pcNewId();
    var body = pcTrim(promptOf(t, id), PC_MAX_BYTES);
    t.pc = { state:"sent", at:Date.now(), reqId:id, open:false, text:"", secs:0, ackAt:0, stale:false, stageKey:"assign", stageIdx:-1, stageDetail:"", stageFrom:"", stageAt:0 };
    /* 보내는 순간 대기 → 진행 중으로 카드가 자리를 옮깁니다 */
    t.status = "doing";
    t.statusAt = Date.now();
    t.statusWhy = "PC로 보냄";
    t.reject = "";
    pcPending[id] = { kind:"task", taskId:t.id };
    save(); renderAll();
    if(!quiet){
      showToast("▶ " + t.dept + " " + t.deptTitle + " 부서로 보냅니다 — " + t.title);
    }
    pcPost(id, body, function(err){
      if(!err) return;
      var card = findTask(taskId);
      if(!card || !card.pc) return;
      if(card.pc.state === "done" || card.pc.state === "error") return;
      card.pc.state = "error";
      card.pc.text = "전송하지 못했습니다: " + (err.message || err);
      card.pc.open = true;
      card.status = "error";
      card.statusAt = Date.now();
      card.statusWhy = "전송 실패";
      delete pcPending[id];
      save(); renderAll();
      showToast("PC로 보내지 못했습니다 — " + (err.message || err));
    });
  }

  function pcBlock(t){
    var p = t.pc;
    if(!p || !p.state) return "";
    var live = (p.state === "sent" || p.state === "running");
    var stale = live && p.stale;
    var label = stale ? "⚠️ 응답 없음" : p.state === "sent" ? "⏳ 대기" : p.state === "running" ? "⚙️ 클로드 작업 중" : p.rejected ? "↩ 반려됨" : p.state === "done" ? "✅ 완료" : "❌ 오류";
    var stateAttr = stale ? "stale" : p.state;
    var sec = live ? 0 : (p.secs || 0);
    var html = '<div class="t-pc" data-pc="' + stateAttr + '">' +
      '<span class="t-pc-state">' + label + '</span>';
    if(live){
      html += '<span class="t-pc-time" data-live-clock="1">' + pcClock((Date.now() - (p.ackAt || p.at || Date.now())) / 1000) + '</span>';
    }else if(sec > 0){
      html += '<span class="t-pc-time">' + pcSecsText(sec) + (p.state === "done" ? " 걸림" : "") + '</span>';
    }
    if(p.text){
      html += '<button class="t-pc-view" type="button" data-act="pcview">' + (p.open ? "접기" : "결과 보기") + '</button>';
    }
    html += '</div>';
    if(live) html += pcLiveBlock(t);
    if(p.text && p.open) html += cardOutHTML(t);
    return html;
  }

  /* 진행 중 카드 — 스피너 · 단계 · 경과 시간 */
  function pcLiveBlock(t){
    var p = t.pc;
    var idx = pcStageIdxOf(t);
    if(p.state === "sent") idx = 0;
    var st = PC_STAGES[idx] || PC_STAGES[0];
    var steps = "";
    for(var i=0;i<PC_STAGES.length;i++){
      steps += '<i class="' + (i < idx ? "on" : i === idx ? "now" : "") + '"></i>';
    }
    var detail = p.state === "sent"
      ? "집 PC가 지시를 받으면 바로 시작합니다 (10분 응답 없으면 표시를 바꿉니다)"
      : (p.stageDetail || (p.stageFrom === "event" ? "PC가 단계를 보고했습니다" : "경과 시간으로 단계를 추정 중 — PC 단계 보고가 오면 정확해집니다"));
    return '<div class="t-live">' +
      '<div class="t-live-head"><span class="spin"></span><b>' + (p.state === "sent" ? "PC 수신 대기" : esc(st.label)) + '</b>' +
        '<span class="t-live-clock" data-live-clock="1">' + pcClock((Date.now() - (p.ackAt || p.at || Date.now())) / 1000) + '</span></div>' +
      '<div class="t-live-steps">' + steps + '</div>' +
      '<p class="t-live-detail">' + esc(detail) + '</p>' +
      '</div>';
  }

  function pcClock(sec){
    sec = Math.max(0, Math.round(sec || 0));
    var m = Math.floor(sec / 60), s = sec % 60;
    return (m < 10 ? "0" : "") + m + ":" + (s < 10 ? "0" : "") + s;
  }

  /* PC가 progress 이벤트를 안 보내도 경과 시간으로 단계를 움직입니다 */
  function pcStageIdxOf(t){
    var p = t && t.pc;
    if(!p) return 0;
    if(p.stageFrom === "event" && typeof p.stageIdx === "number" && p.stageIdx >= 0) return p.stageIdx;
    if(typeof p.autoIdx === "number" && p.autoIdx >= 0 && p.state === "running"){
      /* 1초 틱에서 갱신된 값이 있으면 그대로 */
    }
    var base = p.ackAt || p.at || Date.now();
    var sec = (Date.now() - base) / 1000;
    if(sec < 45) return 0;
    if(sec < 300) return 1;
    if(sec < 420) return 2;
    if(sec < 660) return 3;
    return 4;
  }

  function briefLiveTask(){
    var live = state.tasks.filter(function(t){
      return t.pc && (t.pc.state === "sent" || t.pc.state === "running");
    }).sort(function(a, b){ return (b.pc.at || 0) - (a.pc.at || 0); });
    return live[0] || null;
  }

  function pcTick(){
    var changed = false;
    voTick();
    /* 진행 중 카드의 경과 시간(00:00) 갱신 */
    $$("[data-live-clock]").forEach(function(el){
      var card = el.closest ? el.closest(".task") : null;
      if(!card) return;
      var t = findTask(card.getAttribute("data-id"));
      if(!t || !t.pc) return;
      el.textContent = pcClock((Date.now() - (t.pc.ackAt || t.pc.at || Date.now())) / 1000);
    });
    $$("[data-brief-clock]").forEach(function(el){
      var t = briefLiveTask();
      if(!t) return;
      el.textContent = pcClock((Date.now() - (t.pc.ackAt || t.pc.at || Date.now())) / 1000);
    });
    /* 메인 결과창 — 경과 시간 · 단계 변경 시 다시 그림 */
    $$("[data-hr-clock]").forEach(function(el){
      var lt = heroLiveTask();
      if(!lt) return;
      el.textContent = pcClock((Date.now() - (lt.pc.ackAt || lt.pc.at || Date.now())) / 1000);
    });
    var hl = heroLiveTask();
    if(!heroSel){
      if(hl){
        var hIdx = hl.pc.state === "sent" ? 0 : pcStageIdxOf(hl);
        if(hl.id !== heroStageId || hIdx !== heroStageIdx) renderHeroReport();
      } else if(heroStageId){
        renderHeroReport();
      }
    }
    /* 단계 자동 추정 + 10분 무응답 표시 */
    state.tasks.forEach(function(t){
      if(t.pc && t.pc.state === "running" && t.pc.stageFrom !== "event"){
        var idx = pcStageIdxOf(t);
        if(t.pc.autoIdx !== idx){ t.pc.autoIdx = idx; changed = true; }
      }
      if(t.pc && (t.pc.state === "sent" || t.pc.state === "running") && !t.pc.stale && (Date.now() - (t.pc.at || 0)) > PC_STALE_MS){
        t.pc.stale = true;
        changed = true;
      }
    });
    if(changed){
      save();
      renderBoard();
      renderBrief();
    }
  }
  setInterval(pcTick, 1000);

  /* ==================================================================
     공유 보드 — PC·폰이 같은 카드를 보게 하는 동기화
     · 카드·부서·직원·진행 단계·결과 보고·PC 연결 설정을 "항목" 단위로 나눠
       ntfy 토픽 하나에 흘려 보내고, 다른 기기는 그 흐름을 받아 합칩니다.
     · 브라우저 localStorage 는 복제본입니다 — 동기화가 끊겨도 화면은 그대로 동작합니다.
     · 항목마다 (시각, 기기) 버전이 붙어서, 늦게 도착한 옛 값이 새 값을 덮지 않습니다.
     · 항목 단위라서 충돌이 나도 그 카드 하나만 마지막 저장이 이깁니다(보드 전체가 날아가지 않음).
     ================================================================== */
  var SYNC_ITEMS = "vision_console_items_v1";
  var SYNC_REV   = "vision_console_rev_v1";
  var SYNC_TOMB  = "vision_console_tomb_v1";
  var SYNC_DEV   = "vision_console_dev_v1";
  var SYNC_CODE  = "vision_console_sync_code_v1";
  var SYNC_BOOT  = "vision_console_sync_boot_v1";
  var SYNC_SNAP  = "vision_console_sync_snap_v1";
  var SYNC_MAX   = 3000;                 /* 메시지 한 개 본문 상한 (ntfy 4KB 한도 안쪽) */
  var SYNC_SNAP_GAP  = 3 * 60 * 60 * 1000;   /* 자동 스냅샷 간격 */
  var SYNC_SNAP_OPEN = 2 * 60 * 60 * 1000;       /* 화면 열 때 스냅샷 간격 */
  var SYNC_TOMB_MS   = 30 * 24 * 60 * 60 * 1000;
  var SYNC_PEER_MS   = 15 * 60 * 1000;

  var sync = {
    ready:false, on:false, hold:true, dirty:false, applying:false, bootDone:false, booted:false,
    dev:"", code:"", topic:"", live:"off", note:"",
    items:{}, rev:{}, tomb:{}, shadow:{},
    queue:[], flushTimer:null, lastRev:0,
    es:null, pollTimer:null, retryTimer:null, bootTimer:null, quietTimer:null,
    since:0, seen:{}, seenN:0,
    peers:{}, lastIn:0, lastOut:0, lastSnap:0, lastWant:0, startedAt:0,
    gotRemote:false, dirtySinceSnap:false, fail:0, chunks:{}, renderTimer:null
  };

  function syncHash(s){
    var h1 = 0x811c9dc5, h2 = 0xc2b2ae35, i, c;
    s = String(s == null ? "" : s);
    for(i = 0; i < s.length; i++){
      c = s.charCodeAt(i);
      h1 = Math.imul(h1 ^ c, 16777619) >>> 0;
      h2 = Math.imul(h2 ^ c, 2246822519) >>> 0;
    }
    return h1.toString(36) + h2.toString(36);
  }
  function syncNewDev(){ return "d" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
  function syncStoredCode(){ try{ return localStorage.getItem(SYNC_CODE) || ""; }catch(e){ return ""; } }

  /* 보드 코드 — 따로 넣지 않았으면 이미 쓰는 PC 토픽에서 계산합니다(같은 링크로 열면 저절로 같아짐) */
  function syncCodeNow(){
    var m = syncStoredCode();
    if(m) return m;
    if(pcTopicOk(pc["in"]) && pcTopicOk(pc.out)) return "t" + syncHash("i:" + pc["in"] + "|o:" + pc.out);
    return "";
  }
  function syncTopicNow(){
    var c = String(syncCodeNow() || "").toLowerCase().replace(/[^a-z0-9]/g, "").slice(0, 24);
    return c ? ("butter-sync-9x4k-" + c) : "";
  }
  function syncUrl(tail){ return "https://ntfy.sh/" + encodeURIComponent(sync.topic) + (tail || ""); }

  function syncHasStore(){ try{ return localStorage.getItem(SYNC_ITEMS) !== null; }catch(e){ return false; } }

  /* ---------- 항목 만들기 / 화면에 반영하기 ---------- */
  function syncBuildItems(){
    var m = {};
    (state.tasks || []).forEach(function(t){ if(t && t.id) m["t:" + t.id] = t; });
    DEPTS.forEach(function(d){ if(d && d.no) m["d:" + d.no] = d; });
    if(state.staff) Object.keys(state.staff).forEach(function(no){ m["s:" + no] = state.staff[no]; });
    (state.history || []).forEach(function(h){
      if(!h) return;
      m["h:" + (h.ts || 0) + "-" + syncHash(h.raw)] = h;
    });
    m["cfg"] = { chain: !!state.chain, pc: { "in": pc["in"] || "", out: pc.out || "" } };
    return m;
  }

  function syncProject(){
    var tasks = [], depts = [], hist = [], staff = {}, cfg = null, k, c;
    for(k in sync.items){
      c = sync.items[k];
      if(!c) continue;
      if(k.slice(0, 2) === "t:") tasks.push(c);
      else if(k.slice(0, 2) === "d:") depts.push(c);
      else if(k.slice(0, 2) === "s:") staff[k.slice(2)] = c;
      else if(k.slice(0, 2) === "h:") hist.push(c);
      else if(k === "cfg") cfg = c;
    }
    tasks.sort(function(a, b){ return (b.ts || 0) - (a.ts || 0); });
    depts.sort(function(a, b){ return String(a.no || "").localeCompare(String(b.no || "")); });
    hist.sort(function(a, b){ return (b.ts || 0) - (a.ts || 0); });

    sync.applying = true;
    state.tasks = tasks;
    DEPTS.length = 0;
    depts.forEach(function(d){ DEPTS.push(d); });
    state.depts = DEPTS;
    var st = {};
    DEPTS.forEach(function(d){ st[d.no] = Array.isArray(staff[d.no]) ? staff[d.no] : []; });
    state.staff = st;
    state.history = hist.slice(0, 12);
    if(cfg){
      if(typeof cfg.chain === "boolean") state.chain = cfg.chain;
      if(cfg.pc){
        var ni = pcTopic(cfg.pc["in"]), no2 = pcTopic(cfg.pc.out);
        var pcChanged = (ni && ni !== pc["in"]) || (no2 && no2 !== pc.out);
        if(ni) pc["in"] = ni;
        if(no2) pc.out = no2;
        /* auto(PC로 바로 실행)는 기기마다 다른 설정이라 공유하지 않습니다 */
        if(pcChanged){
          pc.live = "off"; pc.lastOk = 0; pcResetSub();
          pcStore();                        /* ← sync.applying 중이라 되돌아 발행되지 않음 */
          if(pcReady()) pcSub();
        }
      }
    }
    sync.applying = false;
  }

  function syncPersist(){
    state.depts = DEPTS;
    try{
      localStorage.setItem(SYNC_ITEMS, JSON.stringify(sync.items));
      localStorage.setItem(SYNC_REV, JSON.stringify(sync.rev));
      localStorage.setItem(SYNC_TOMB, JSON.stringify(sync.tomb));
      localStorage.setItem(SYNC_BOOT, sync.booted ? "1" : "0");
      localStorage.setItem(SYNC_SNAP, String(sync.lastSnap || 0));
      localStorage.setItem(STORE, JSON.stringify(state));
    }catch(e){}
  }

  function syncLoad(){
    try{ sync.dev = localStorage.getItem(SYNC_DEV) || ""; }catch(e){ sync.dev = ""; }
    if(!sync.dev){
      sync.dev = syncNewDev();
      try{ localStorage.setItem(SYNC_DEV, sync.dev); }catch(e){}
    }
    try{ sync.items = JSON.parse(localStorage.getItem(SYNC_ITEMS) || "{}") || {}; }catch(e){ sync.items = {}; }
    try{ sync.rev = JSON.parse(localStorage.getItem(SYNC_REV) || "{}") || {}; }catch(e){ sync.rev = {}; }
    try{ sync.tomb = JSON.parse(localStorage.getItem(SYNC_TOMB) || "{}") || {}; }catch(e){ sync.tomb = {}; }
    try{ sync.booted = localStorage.getItem(SYNC_BOOT) === "1"; }catch(e){ sync.booted = false; }
    try{ sync.lastSnap = Number(localStorage.getItem(SYNC_SNAP) || 0) || 0; }catch(e){ sync.lastSnap = 0; }
    if(!syncHasStore()){
      /* 예전 vision_console_v1 데이터 → 항목으로 쪼개서 보관(최초 1회 마이그레이션).
         버전은 비워 둡니다 — 다른 PC에 이미 있는 항목이 있으면 그쪽이 이깁니다. */
      sync.items = syncBuildItems();
      sync.rev = {};
      sync.tomb = {};
    }
    sync.shadow = {};
    for(var k in sync.items){ sync.shadow[k] = JSON.stringify(sync.items[k]); }
    sync.ready = true;
  }

  /* ---------- 바뀈을 때 항목별로 콜라내기 ---------- */
  function syncNextRev(){
    sync.lastRev = Math.max(Date.now(), (sync.lastRev || 0) + 1);
    return { t: sync.lastRev, d: sync.dev };
  }
  function syncNewer(a, b){
    if(!b) return true;
    if(!a) return false;
    if((a.t || 0) !== (b.t || 0)) return (a.t || 0) > (b.t || 0);
    return String(a.d || "") > String(b.d || "");
  }

  function syncAfterSave(){
    if(!sync.ready || !sync.on || sync.applying) return;
    if(sync.hold){ sync.dirty = true; return; }
    var now = syncBuildItems(), k, s, list = [], gone = [];
    for(k in now){
      s = JSON.stringify(now[k]);
      if(sync.shadow[k] !== s){
        sync.items[k] = now[k];
        sync.rev[k] = syncNextRev();
        sync.shadow[k] = s;
        list.push({ key:k, r: sync.rev[k], c: now[k] });
      }
    }
    for(k in sync.shadow){ if(!(k in now)) gone.push(k); }
    gone.forEach(function(key){
      delete sync.items[key];
      delete sync.shadow[key];
      delete sync.rev[key];
      sync.tomb[key] = syncNextRev();
      list.push({ key:key, r: sync.tomb[key], c: null });
    });
    var nowT = Date.now();
    for(k in sync.tomb){ if(nowT - (sync.tomb[k].t || 0) > SYNC_TOMB_MS) delete sync.tomb[k]; }
    syncPersist();
    if(list.length){ sync.dirtySinceSnap = true; syncQueue(list); }
  }

  function syncQueue(list){
    if(!list || !list.length) return;
    sync.queue = sync.queue.concat(list);
    if(sync.flushTimer || sync.hold) return;
    sync.flushTimer = setTimeout(function(){ sync.flushTimer = null; syncFlush(); }, 900);
  }
  function syncFlush(){
    if(!sync.queue.length || !sync.on) return;
    if(sync.hold){
      if(!sync.flushTimer) sync.flushTimer = setTimeout(function(){ sync.flushTimer = null; syncFlush(); }, 900);
      return;
    }
    var list = sync.queue;
    sync.queue = [];
    syncPublish({ a:"vcs", v:2, d:sync.dev, k:"d", at: Date.now(), it: list });
  }

  /* ---------- 보내기 ---------- */
  function syncSplit(text, maxBytes){
    var out = [], cur = "", size = 0, i, ch, b, c;
    for(i = 0; i < text.length; i++){
      ch = text.charAt(i);
      c = text.charCodeAt(i);
      b = c < 128 ? 1 : (c < 2048 ? 2 : 3);
      if(size + b > maxBytes && cur){ out.push(cur); cur = ""; size = 0; }
      cur += ch; size += b;
    }
    if(cur) out.push(cur);
    return out.length ? out : [""];
  }
  function syncPublish(obj){
    if(!sync.on || !sync.topic) return;
    var text;
    try{ text = JSON.stringify(obj); }catch(e){ return; }
    var parts = syncSplit(text, SYNC_MAX), i;
    if(parts.length === 1){ syncPost(parts[0], 0); return; }
    var id = "m" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
    for(i = 0; i < parts.length; i++){
      syncPost(JSON.stringify({ a:"vcs", v:2, d:sync.dev, k:"c", id:id, i:i + 1, n:parts.length, s:parts[i] }), i * 250);
    }
  }
  function syncPost(body, delay){
    var go = function(){
      if(!sync.on) return;
      fetch(syncUrl(""), {
        method:"POST",
        headers:{ "Content-Type":"text/plain; charset=utf-8", "X-Priority":"1", "X-Cache":"yes", "X-Firebase":"no" },
        body: body,
        cache:"no-store"
      }).then(function(r){
        if(r.ok){ sync.lastOut = Date.now(); sync.fail = 0; return; }
        if(r.status === 429){ sync.fail++; sync.note = "전송 한도에 걸렸습니다 — 잠시 뒤 다시 맞춥니다"; }
        throw new Error("HTTP " + r.status);
      }).catch(function(){
        sync.fail++;
        if(sync.fail > 4 && !sync.note) sync.note = "동기화 전송이 막혔습니다 — 네트워크를 확인하세요";
        syncRender();
      });
    };
    if(delay) setTimeout(go, delay); else go();
  }

  function syncSnapshot(){
    if(!sync.on) return;
    var list = [], k;
    for(k in sync.items){
      if(!sync.rev[k]) sync.rev[k] = syncNextRev();
      list.push({ key:k, r: sync.rev[k], c: sync.items[k] });
    }
    for(k in sync.tomb){ list.push({ key:k, r: sync.tomb[k], c: null }); }
    sync.lastSnap = Date.now();
    sync.dirtySinceSnap = false;
    syncPublish({ a:"vcs", v:2, d:sync.dev, k:"s", at: sync.lastSnap, it: list });
    try{ localStorage.setItem(SYNC_SNAP, String(sync.lastSnap)); }catch(e){}
  }
  function syncWant(){
    if(!sync.on) return;
    sync.lastWant = Date.now();
    syncPublish({ a:"vcs", v:2, d:sync.dev, k:"w", at: Date.now(), n: Object.keys(sync.items).length });
  }

  /* ---------- 받기 ---------- */
  function syncFeed(raw){
    var ev;
    try{ ev = JSON.parse(raw); }catch(e){ return; }
    if(!ev || ev.event !== "message" || typeof ev.message !== "string") return;
    if(ev.id){
      if(sync.seen[ev.id]) return;
      sync.seen[ev.id] = 1;
      sync.seenN++;
      if(sync.seenN > 600){ sync.seen = {}; sync.seenN = 0; sync.seen[ev.id] = 1; }
    }
    if(ev.time && ev.time > sync.since) sync.since = ev.time;
    var p;
    try{ p = JSON.parse(ev.message); }catch(e){ return; }
    if(!p || p.a !== "vcs") return;
    if(p.d && p.d === sync.dev) return;
    if(p.d) sync.peers[p.d] = Date.now();
    if(p.k === "c"){ syncChunk(p); return; }
    syncHandle(p);
  }
  function syncChunk(p){
    if(!p.id || !p.n) return;
    var box = sync.chunks[p.id];
    if(!box){ box = sync.chunks[p.id] = { n:p.n, got:{}, at: Date.now() }; }
    box.got[p.i] = String(p.s || "");
    var cnt = 0, i;
    for(i in box.got){ cnt++; }
    if(cnt < box.n){
      if(Date.now() - box.at > 180000) delete sync.chunks[p.id];
      return;
    }
    var txt = "";
    for(i = 1; i <= box.n; i++) txt += (box.got[i] || "");
    delete sync.chunks[p.id];
    var p2;
    try{ p2 = JSON.parse(txt); }catch(e){ return; }
    if(!p2 || p2.a !== "vcs" || p2.d === sync.dev) return;
    syncHandle(p2);
  }
  function syncHandle(p){
    if(p.k === "d"){ syncApply(p.it); return; }
    if(p.k === "s"){ syncApply(p.it, true); return; }
    if(p.k === "w"){
      if(Date.now() - sync.lastSnap > 45000 && !sync.hold) setTimeout(syncSnapshot, 300 + Math.random() * 1500);
      return;
    }
    /* p(생존 신고) — 위에서 peers 에 기록됨 */
  }
  function syncApply(list, isSnap){
    if(!list || !list.length) return;
    var n = 0, i, e, L;
    sync.applying = true;
    for(i = 0; i < list.length; i++){
      e = list[i];
      if(!e || !e.key || !e.r) continue;
      L = sync.rev[e.key] || sync.tomb[e.key];
      if(L && !syncNewer(e.r, L)) continue;
      if(e.r.t > (sync.lastRev || 0)) sync.lastRev = e.r.t;
      if(e.c == null){
        delete sync.items[e.key]; delete sync.rev[e.key]; delete sync.shadow[e.key];
        sync.tomb[e.key] = e.r;
      }else{
        sync.items[e.key] = e.c;
        sync.rev[e.key] = e.r;
        delete sync.tomb[e.key];
        sync.shadow[e.key] = JSON.stringify(e.c);
      }
      n++;
    }
    sync.applying = false;
    if(!n) return;
    sync.gotRemote = true;
    sync.lastIn = Date.now();
    sync.dirtySinceSnap = true;
    syncProject();
    syncPersist();
    syncRenderSoon();
    if(sync.hold){
      clearTimeout(sync.quietTimer);
      sync.quietTimer = setTimeout(syncBootDone, 1500);
    }
  }

  function syncRenderSoon(){
    if(sync.renderTimer) return;
    sync.renderTimer = setTimeout(function(){
      sync.renderTimer = null;
      renderAll();
      renderPC();
      syncRender();
    }, 120);
  }

  /* ---------- 연결 ---------- */
  function syncStart(){
    if(!sync.ready) return;
    sync.code = syncCodeNow();
    sync.topic = syncTopicNow();
    sync.startedAt = Date.now();
    sync.hold = true;
    sync.bootDone = false;
    sync.gotRemote = false;
    sync.note = "";
    sync.fail = 0;
    if(!sync.topic){ sync.on = false; sync.live = "off"; syncRender(); return; }
    sync.on = true;
    sync.live = "checking";
    syncSub();
    clearTimeout(sync.bootTimer);
    sync.bootTimer = setTimeout(syncBootDone, 2500);
    syncRender();
  }
  function syncRestart(){
    if(sync.es){ try{ sync.es.close(); }catch(e){} sync.es = null; }
    if(sync.pollTimer){ clearInterval(sync.pollTimer); sync.pollTimer = null; }
    clearTimeout(sync.retryTimer); clearTimeout(sync.bootTimer); clearTimeout(sync.quietTimer);
    sync.since = 0; sync.seen = {}; sync.seenN = 0; sync.chunks = {}; sync.peers = {};
    sync.queue = [];
    syncStart();
  }
  function syncSub(){
    if(!sync.on || sync.es || sync.pollTimer) return;
    if(typeof EventSource === "undefined"){ syncPoll(); return; }
    try{
      sync.es = new EventSource(syncUrl("/sse?since=all"));
    }catch(e){ sync.es = null; syncPoll(); return; }
    sync.es.onopen = function(){ sync.live = "on"; sync.note = ""; syncRender(); };
    sync.es.onmessage = function(e){ syncFeed(e.data); };
    sync.es.onerror = function(){
      if(sync.es){ try{ sync.es.close(); }catch(e){} sync.es = null; }
      sync.live = "checking";
      syncRender();
      syncPoll();
      clearTimeout(sync.retryTimer);
      sync.retryTimer = setTimeout(function(){
        if(sync.es || sync.pollTimer) return;
        syncSub();
      }, 60000);
    };
  }
  function syncPoll(){
    if(sync.pollTimer || !sync.on) return;
    syncPollOnce();
    sync.pollTimer = setInterval(syncPollOnce, 6000);
  }
  function syncPollOnce(){
    if(!sync.on){ if(sync.pollTimer){ clearInterval(sync.pollTimer); sync.pollTimer = null; } return; }
    fetch(syncUrl("/json?poll=1&since=all"), { cache:"no-store" })
      .then(function(r){ return r.text(); })
      .then(function(t){
        if(!sync.pollTimer && !sync.es) sync.live = "on";
        String(t || "").split("\n").forEach(function(line){
          line = line.replace(/^\s+|\s+$/g, "");
          if(line) syncFeed(line);
        });
        syncRender();
      })
      .catch(function(){ sync.live = "checking"; syncRender(); });
  }

  /* ---------- 첫 연결: 마이그레이션 · 시드 ---------- */
  function syncBootDone(){
    if(sync.bootDone || !sync.on) return;
    sync.bootDone = true;
    clearTimeout(sync.bootTimer); clearTimeout(sync.quietTimer);
    if(sync.gotRemote){ syncBootFinish(); return; }
    syncWant();
    setTimeout(function(){
      if(!sync.on) return;
      syncBootFinish();
    }, 2200);
  }
  function syncBootFinish(){
    if(!sync.hold) return;
    sync.hold = false;
    sync.booted = true;
    if(!sync.gotRemote){
      /* 이 보드에 아직 아무도 없다 — 이 PC 상태를 첫 값으로 올립니다 */
      syncSnapshot();
    }else{
      var list = [], k;
      for(k in sync.items){
        if(!sync.rev[k]){ sync.rev[k] = syncNextRev(); list.push({ key:k, r: sync.rev[k], c: sync.items[k] }); }
      }
      if(list.length) syncQueue(list);
      else if(Date.now() - sync.lastSnap > SYNC_SNAP_OPEN) setTimeout(syncSnapshot, 1500);
    }
    syncPersist();
    if(sync.dirty){ sync.dirty = false; syncAfterSave(); }
    syncFlush();
    /* 다른 기기가 새로 열 때 바로 받도록, 이 PC 상태를 캐시에 한 번 남깁니다 */
    if(sync.gotRemote && Date.now() - sync.lastSnap > SYNC_SNAP_OPEN) setTimeout(syncSnapshot, 2500);
    syncRender();
  }

  /* ---------- 화면 ---------- */
  function syncPeerCount(){
    var n = 0, now = Date.now(), k;
    for(k in sync.peers){ if(now - sync.peers[k] < SYNC_PEER_MS) n++; else delete sync.peers[k]; }
    return n;
  }
  function syncRender(){
    var pill = $("#syncPill"), txt = $("#syncPillTxt");
    var peers = syncPeerCount();
    var st = !sync.on ? "off" : (sync.live === "on" ? "on" : "checking");
    if(pill){
      pill.setAttribute("data-live", st);
      pill.title = st === "on"
        ? "공유 보드 연결됨 — 다른 PC·폰과 같은 카드를 봅니다"
        : st === "checking" ? "공유 보드에 연결하는 중"
        : "공유 보드가 꺼져 있습니다 — 눌러서 설정";
    }
    if(txt){
      txt.textContent = st === "on"
        ? (peers > 0 ? "공유 중 · " + (peers + 1) + "대" : "공유 중")
        : st === "checking" ? "공유 연결 중" : "공유 꺼짐";
    }
    var box = $("#syncState");
    if(box){
      box.setAttribute("data-live", st);
      if(st === "off"){
        box.innerHTML = "<b>공유 보드가 꺼져 있습니다.</b><br>① 위에 집 PC 토픽을 넣고 저장하거나,\n② 다른 PC에서 <b>[동기화 링크 복사]</b>를 누른 뒤 그 링크를 이 PC에서 여세요.";
      }else if(st === "checking"){
        box.innerHTML = "<b>연결하는 중…</b>" + (sync.note ? " " + esc(sync.note) : "");
      }else{
        var parts = [];
        parts.push("<b>공유 중</b> — " + (peers > 0 ? (peers + 1) + "대가 같이 보고 있습니다" : "다른 기기에서 이 보드를 열면 같은 카드가 저절로 맞춰집니다"));
        if(sync.lastIn) parts.push("마지막 반영 " + pcAgo(sync.lastIn));
        if(sync.note) parts.push(esc(sync.note));
        box.innerHTML = parts.join(" · ") + "\n<span style=\"opacity:.75\">보드 코드 " + esc(sync.code) + " — 다른 기기도 같은 코드여야 합니다.</span>";
      }
    }
    var inp = $("#syncCodeIn");
    if(inp && document.activeElement !== inp) inp.value = sync.code || "";
  }

  function syncMount(){
    var pill = $("#syncPill");
    if(pill) pill.addEventListener("click", function(){

    });

  /* ---------- 상태 점검(3초) ---------- */
  function syncTick(){
    if(!sync.ready) return;
    if(syncTopicNow() !== sync.topic){ syncRestart(); return; }
    if(sync.hold && !sync.bootDone && Date.now() - sync.startedAt > 6000) syncBootDone();
    if(!sync.bootDone) return;
    syncPeerCount();
    syncRender();
    if(sync.on && sync.dirtySinceSnap && Date.now() - sync.lastSnap > SYNC_SNAP_GAP){ syncSnapshot(); }
  }
  setInterval(syncTick, 3000);

  /* 같은 PC의 다른 탭과도 맞춥니다(localStorage 는 공유되지만 화면은 따로 그려짐) */
  window.addEventListener("storage", function(e){
    if(!e || !e.key) return;
    if(e.key !== SYNC_ITEMS && e.key !== SYNC_REV) return;
    if(!sync.ready || sync.applying) return;
    try{
      var it = JSON.parse(localStorage.getItem(SYNC_ITEMS) || "null");
      if(!it) return;
      sync.items = it;
      try{ sync.rev = JSON.parse(localStorage.getItem(SYNC_REV) || "{}") || {}; }catch(e2){}
      sync.shadow = {};
      for(var k in sync.items){ sync.shadow[k] = JSON.stringify(sync.items[k]); }
      syncProject();
      syncRenderSoon();
    }catch(e3){}
  });

  /* ==================================================================
     V2 — 시안 개편 (간결한 보고창 · 컴팩트 보드 · 3D 오피스 레이어)
     ================================================================== */
  var baseRenderAll = renderAll;
  var baseHeroLive = heroLiveTask;
  heroLiveTask = function(){
    var t = baseHeroLive();
    if(!t || !t.pc) return null;
    return (Date.now() - (t.pc.ackAt || t.pc.at || Date.now())) > 600000 ? null : t;
  };

  /* ---------- 요약 ---------- */
  function plainSummary(text, max){
    var s = String(text == null ? "" : text)
      .replace(/```[\s\S]*?```/g, " ")
      .replace(/^\s*\|?[\s:|\-]{4,}\|?\s*$/gm, " ")
      .replace(/^#{1,6}\s*/gm, "")
      .replace(/[|*>`]/g, " ")
      .replace(/[-–—]{2,}/g, " ")
      .replace(/\s+/g, " ")
      .trim();
    if(!max) max = 150;
    if(s.length > max) s = s.slice(0, max - 1).replace(/[\s,·:;]+$/, "") + "…";
    return s;
  }
  function taskSummary(t){

      var out = plainSummary(src, 150);
      if(out) return out;
    }
    return plainSummary(t.criteria || t.instr || "", 150);
  }
  function hhmm(ts){
    var d = new Date(ts || Date.now());

    return p(d.getHours()) + ":" + p(d.getMinutes());
  }

  /* ---------- 보드 ---------- */
  var ICON_PLAY = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5.2v13.6c0 .8.9 1.3 1.6.9l10.2-6.8a1.1 1.1 0 000-1.8L9.6 4.3A1.1 1.1 0 008 5.2z"/></svg>';

  var ICON_NEXT = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>';

  function cardHTML(t){

      '<span>담당 <select data-modal-staff>' + staffOpts + '</select></span>';

    var view = modalSec;
    if(view !== "full" && !parsed.map[view]) view = parsed.map.report ? "report" : "full";

    tmTabs.innerHTML = keys.length ? keys.map(function(k){
      var lbl = k === "full" ? "원문" : (k === "report" ? "최종 보고" : (RES_TITLE[k] || k));

    taskModal.addEventListener("click", function(e){
      var tg = e.target;
      if(tg.closest("[data-task-close]")){ closeTaskModal(); return; }
      var tab = tg.closest("[data-modal-sec]");
      if(tab){ modalSec = tab.getAttribute("data-modal-sec"); renderTaskModal(); return; }
      var act = tg.closest("[data-modal-act]");
      if(!act) return;
      var t = findTask(modalTaskId);
      if(!t) return;
      var kind = act.getAttribute("data-modal-act");
      if(kind === "approve"){ approveTask(t.id); renderTaskModal(); }
      else if(kind === "reject"){ rejectTask(t.id); renderTaskModal(); }
      else if(kind === "copy"){
        var pr = parseResult((t.pc && t.pc.text) || "");
        var v = (modalSec !== "full" && pr.map[modalSec]) ? pr.map[modalSec] : ((t.pc && t.pc.text) || t.instr || "");
        copyText(v);
      }
      else if(kind === "md"){ resDownload(t); }
      else if(kind === "pcrun"){ pcRun(t.id); renderTaskModal(); }
      else if(kind === "adv"){ advance(t.id); renderTaskModal(); }
      else if(kind === "del"){
        if(window.confirm("이 카드를 삭제할까요? 되돌릴 수 없습니다.")){ removeTask(t.id); closeTaskModal(); }
      }
    });
    taskModal.addEventListener("change", function(e){
      var t = findTask(modalTaskId);
      if(!t) return;
      if(e.target.matches("[data-modal-dept]")){
        if(e.target.value && e.target.value !== t.dept) retargetTask(t.id, e.target.value);
        renderTaskModal();
        return;

      if(e.target.matches("[data-modal-staff]")){
        var v = e.target.value || "";
        if(!v){ t.staffId = ""; t.staffName = ""; }
        else {
          var s = findStaff(t.dept, v);
          t.staffId = s ? s.id : "";
          t.staffName = s ? s.name : (t.staffName || "");
        }
        save(); renderAll();
        showToast(t.staffId ? "담당을 " + staffNameOf(t) + "(으)로 바꿨습니다" : "담당을 미배정으로 돌렸습니다");
      }
    });
  }

  /* 카드·데스크·구역 클릭 */
  document.addEventListener("click", function(e){
    var tg = e.target;
    if(!tg || !tg.closest) return;
    if(tg.closest("[data-task-close]")) return;
    var card = tg.closest(".task");
    if(card && !tg.closest("[data-act]")){
      openTaskModal(card.getAttribute("data-id"));
      return;
    }
    var open = tg.closest("[data-dept-open]");
    if(open){
      var no = open.getAttribute("data-dept-open");
      for(var i = 0; i < DEPTS.length; i++){
        if(DEPTS[i].no === no){ closeOfficeSheet(); openDept(i); return; }
      }
      return;
    }
    if(tg.closest("[data-zone]") || tg.closest(".stage-img")){ openOfficeSheet(); return; }
    if(tg.closest("[data-office-close]")){ closeOfficeSheet(); return; }
  });
  document.addEventListener("keydown", function(e){
    if(e.key === "Enter" || e.key === " "){
      var el = e.target;
      if(el && el.classList && el.classList.contains("task")){
        e.preventDefault();
        openTaskModal(el.getAttribute("data-id"));
      }
    }
    if(e.key === "Escape"){
      var m = $("#taskModal");
      if(m && !m.hidden){ closeTaskModal(); return; }
      var os = $("#officeSheet");
      if(os && !os.hidden){ closeOfficeSheet(); }
    }
  });

  /* renderAll 래핑 — 열려 있는 상세도 같이 갱신 */
  renderAll = function(){
    baseRenderAll();
    if(taskModal && !taskModal.hidden) renderTaskModal();
    var bc = $("#boardCount"); if(bc) bc.textContent = state.tasks.length;
  };

  /* 부서 칩에 이름 툴팁 */
  renderPickChips = function(){
    var box = $("#pickChips");
    if(!box) return;
    box.innerHTML = DEPTS.map(function(d){
      return '<button type="button" class="pick-chip" data-pick="' + d.no + '" aria-pressed="false" title="' + esc(d.no + " " + d.title) + '">' + d.no + '</button>';
    }).join("");
  };

  /* 시계 */
  (function(){
    var el = $("#clock");
    function tick(){
      if(!el) return;
      var d = new Date();
      function p(n){ return (n < 10 ? "0" : "") + n; }
      el.textContent = p(d.getHours()) + ":" + p(d.getMinutes());
    }
    tick();
    setInterval(tick, 15000);
  })();

  /* ================= 시작 ================= */
  load();
  if(!state.staff) state.staff = staffDefaults();
  pcLoad();
  syncLoad();
  resLoadSeen();
  /* 예전 저장값(직원 명단 없음)의 카드는 부서 대표 직원에게 이어받게 함 */
  if(legacyStaffData){
    var adopted = 0;
    state.tasks.forEach(function(t){
      if(!t.staffId && !t.staffName){
        var c = matchStaff(t.dept, t.instr || "");
        if(c && c[0]){ t.staffId = c[0].id; t.staffName = c[0].name; adopted++; }
      }
    });
    if(adopted) save();
  }
  pcBind();
  pcReadHash();
  renderPickChips();
  bindChain();
  renderAll();
  renderPC();
  syncMount();
  syncRender();
  if(pcReady()){ pcSub(); pcCheck(); }
  syncStart();
})();
</script>
</body>
</html>
