<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>비서실 지휘 콘솔 | 주식회사 비전 (대표 전용)</title>
<meta name="description" content="김용진 대표님 전용 내부 콘솔. 지시를 부서별 업무 카드로 분담하고, 상태를 관리합니다.">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="theme-color" content="#0a1929">
<meta property="og:title" content="비서실 지휘 콘솔 (내부용)">
<meta property="og:description" content="대표님 전용 내부 운영 콘솔입니다.">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230a1929'/%3E%3Cpath d='M9 11l7 11 7-11' stroke='%23ff6a1f' stroke-width='3.2' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
/* ============ tokens ============ */
:root{
  --cream:#f5f1e9; --cream-2:#faf7f1; --paper:#fffdfa; --card:#ffffff;
  --ink:#17232e; --sub:#5d6d79; --muted:#8b98a2;
  --line:#e9e1d4; --line-2:#dcd2c2;
  --navy:#142635; --navy-2:#22394c;
  --orange:#f26419; --orange-d:#d9540f; --orange-tint:#fff1e7;
  --green:#1d8a5c; --green-tint:#e9f7f0;
  --blue:#2563b0; --blue-tint:#eaf2fc;
  --red:#c9403e; --red-tint:#fdeceb;
  --radius:22px; --max:1320px; --head:62px;
  --shadow:0 1px 2px rgba(60,42,20,.04),0 18px 40px -28px rgba(60,42,20,.35);
  --shadow-lg:0 40px 90px -46px rgba(60,42,20,.5);
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:calc(var(--head) + 14px)}
body{margin:0;font-family:"Pretendard","Pretendard Variable",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic","Segoe UI",Roboto,Arial,sans-serif;
  font-size:15.5px;line-height:1.6;color:var(--ink);background:var(--cream);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;word-break:keep-all}
img,svg{display:block;max-width:100%}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
ul,ol{margin:0;padding:0;list-style:none}
h1,h2,h3,h4,p{margin:0}
input,textarea,select{font:inherit}
:focus-visible{outline:3px solid rgba(242,100,25,.4);outline-offset:2px;border-radius:8px}
.wrap{max-width:var(--max);margin:0 auto;padding:0 26px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ============ buttons ============ */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:42px;padding:0 18px;border-radius:12px;font-weight:800;font-size:14px;letter-spacing:-.01em;transition:background .16s,color .16s,border-color .16s,transform .16s,box-shadow .16s;white-space:nowrap}
.btn svg{width:15px;height:15px;flex:none}
.btn-primary{background:var(--orange);color:#fff;box-shadow:0 12px 26px -14px rgba(242,100,25,.9)}
.btn-primary:hover{background:var(--orange-d);transform:translateY(-1px)}
.btn-ghost{background:#fff;border:1px solid var(--line-2);color:var(--ink)}
.btn-ghost:hover{border-color:var(--navy);transform:translateY(-1px)}
.btn-text{background:transparent;color:var(--sub);padding:0 10px}
.btn-text:hover{color:var(--ink);background:rgba(20,38,53,.05)}
.btn-sm{height:34px;padding:0 12px;font-size:12.5px;border-radius:9px}
.btn:disabled{opacity:.45;cursor:default;transform:none}
.chip{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 9px;border-radius:999px;font-size:11px;font-weight:800;letter-spacing:-.01em;background:var(--blue-tint);color:#1e5596}
.chip-wait{background:#f0f3f6;color:#5a6b78}
.chip-doing{background:var(--blue-tint);color:#1a5399}
.chip-review{background:var(--orange-tint);color:var(--orange-d)}
.chip-done{background:var(--green-tint);color:#146d47}
.chip-error{background:var(--red-tint);color:#a8322f}
.tag{display:inline-flex;align-items:center;gap:5px;padding:3px 8px;border-radius:7px;background:#f7f3ec;border:1px solid var(--line);font-size:11px;font-weight:700;color:#5b6b77}

/* ============ header ============ */
.top{position:sticky;top:0;z-index:60;background:rgba(250,247,241,.9);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}
.top-in{height:var(--head);display:flex;align-items:center;gap:26px}
.brand{display:flex;align-items:center;gap:10px;flex:none;color:var(--navy)}
.brand-mark{position:relative;width:32px;height:32px;border-radius:9px;background:var(--navy);color:#fff;display:grid;place-items:center;font-weight:800;font-size:14px}
.brand-mark::after{content:"";position:absolute;right:-3px;top:-3px;width:8px;height:8px;border-radius:50%;background:var(--orange);border:2px solid #faf7f1}
.brand-name{font-size:14.5px;font-weight:800;letter-spacing:-.02em}
.brand-sub{font-size:11px;font-weight:800;color:var(--muted);letter-spacing:.02em;padding-left:10px;border-left:1px solid var(--line-2);margin-left:2px}
.nav{display:flex;align-items:center;gap:2px}
.nav a{position:relative;padding:8px 13px;border-radius:9px;font-size:13.5px;font-weight:800;color:var(--sub);transition:.15s}
.nav a:hover{color:var(--ink);background:rgba(20,38,53,.05)}
.nav a.is-on{color:var(--navy)}
.nav a.is-on::after{content:"";position:absolute;left:13px;right:13px;bottom:2px;height:2px;border-radius:2px;background:var(--orange)}
.nav-badge{display:inline-grid;place-items:center;min-width:16px;height:16px;padding:0 4px;margin-left:4px;border-radius:99px;background:var(--orange);color:#fff;font-size:9.5px;font-weight:800;font-family:var(--mono);vertical-align:1px}
.nav-badge[hidden]{display:none}
.top-right{margin-left:auto;display:flex;align-items:center;gap:10px}
.clock{font-family:var(--mono);font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.02em}
.pc-pill{display:inline-flex;align-items:center;gap:7px;height:32px;padding:0 12px;border-radius:999px;border:1px solid var(--line-2);background:#fff;font-size:11.5px;font-weight:800;color:var(--sub);transition:.15s}
.pc-pill:hover{border-color:var(--navy);color:var(--ink)}
.pc-pill::before{content:"";width:7px;height:7px;border-radius:50%;background:#b9c3cb;flex:none}
.pc-pill[data-live="on"]{color:#146d47;border-color:#bfe3d2;background:#f4fbf7}
.pc-pill[data-live="on"]::before{background:var(--green);box-shadow:0 0 0 3px rgba(29,138,92,.14)}
.pc-pill[data-live="checking"]::before{background:#e0a21a;animation:pulseDot 1s ease-in-out infinite}
.icon-btn{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;border:1px solid var(--line-2);background:#fff;color:var(--sub)}
.icon-btn:hover{border-color:var(--navy);color:var(--ink)}
.icon-btn svg{width:15px;height:15px}

/* ============ hero ============ */
.hero{padding:26px 0 34px;background:
  radial-gradient(90% 120% at 100% 0%,rgba(242,100,25,.07),rgba(242,100,25,0) 58%),
  linear-gradient(180deg,#f8f5ef 0%,var(--cream) 100%)}
.hero-grid{display:grid;grid-template-columns:minmax(340px,400px) minmax(0,1fr);gap:20px;align-items:stretch}

/* 명령 */
.cmd-col{display:flex;flex-direction:column;gap:12px;min-width:0}
.cmd{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px 16px 14px;box-shadow:var(--shadow)}
.cmd-label{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.cmd-date{letter-spacing:0;text-transform:none;font-family:var(--mono);font-size:11px;color:var(--muted)}
.cmd textarea{display:block;width:100%;min-height:148px;margin-top:10px;padding:14px 15px;border:1px solid var(--line);border-radius:14px;background:var(--cream-2);font-size:16px;line-height:1.65;color:var(--ink);resize:vertical;transition:.15s}
.cmd textarea::placeholder{color:#a9b3bb}
.cmd textarea:focus{outline:none;border-color:var(--orange);background:#fff;box-shadow:0 0 0 3px rgba(242,100,25,.12)}
.presets{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.preset{height:28px;padding:0 10px;border-radius:8px;border:1px solid var(--line);background:#fff;font-size:11.5px;font-weight:800;color:#6b7a85;transition:.14s}
.preset:hover{border-color:var(--orange);color:var(--orange-d);background:var(--orange-tint)}
.pick-chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:12px;padding-top:12px;border-top:1px dashed var(--line)}
.pick-chip{height:27px;min-width:31px;padding:0 7px;border-radius:7px;border:1px solid var(--line-2);background:#fff;font-size:11px;font-weight:800;color:#7a8893;font-family:var(--mono);transition:.14s}
.pick-chip:hover{border-color:var(--navy);color:var(--navy)}
.pick-chip.is-on{background:var(--navy);border-color:var(--navy);color:#fff}
.cmd-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:12px}
.cmd-actions .btn-primary{flex:1;min-width:150px}
.switch{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:800;color:var(--sub);cursor:pointer;user-select:none;padding:4px 2px}
.switch input{position:absolute;opacity:0;pointer-events:none}
.switch i{position:relative;width:34px;height:19px;border-radius:99px;background:#d5dbe0;transition:.16s;flex:none}
.switch i::after{content:"";position:absolute;left:2px;top:2px;width:15px;height:15px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:.16s}
.switch input:checked + i{background:var(--orange)}
.switch input:checked + i::after{transform:translateX(15px)}
.switch.is-off{opacity:.55}
.switch:has(input:focus-visible) i{outline:2px solid rgba(242,100,25,.5);outline-offset:2px}
.cmd-result{display:none;margin-top:12px;padding:9px 12px;border-radius:11px;background:var(--blue-tint);border:1px solid #cfe0f5;font-size:12px;color:#24455f;line-height:1.6}
.cmd-result.is-on{display:block;animation:pop .25s ease}
.cmd-result b{color:var(--navy)}
.cmd-result .rs-depts{display:inline-flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.cmd-result .rs-depts span{font-family:var(--mono);font-size:10.5px;font-weight:800;background:#fff;border:1px solid #dbe8f5;border-radius:5px;padding:1px 6px;color:#2c4a66}

.stats{display:grid;grid-template-columns:repeat(5,1fr);background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px 6px;box-shadow:var(--shadow)}
.stat{text-align:center;padding:3px 2px;position:relative}
.stat + .stat::before{content:"";position:absolute;left:0;top:16%;bottom:16%;width:1px;background:var(--line)}
.stat b{display:block;font-family:var(--mono);font-size:20px;font-weight:800;letter-spacing:-.03em;line-height:1.25;color:var(--navy)}
.stat span{display:block;font-size:10.5px;font-weight:800;color:var(--muted)}
.stat[data-k="doing"] b{color:var(--blue)} .stat[data-k="review"] b{color:var(--orange-d)}
.stat[data-k="done"] b{color:var(--green)} .stat[data-k="error"] b{color:var(--red)}
.brief-now{display:flex;align-items:center;gap:6px;flex-wrap:wrap;min-height:20px;font-size:12px;font-weight:700;color:var(--sub);padding:0 4px}
.brief-now b{color:var(--navy);font-weight:800}
.res-quick{margin-left:auto;font-size:11.5px;font-weight:800;color:var(--orange-d);white-space:nowrap}
.res-quick.is-new{background:var(--orange);color:#fff;border-radius:99px;padding:2px 9px}

/* ============ 결과 보고 ============ */
.report-wrap{min-width:0;display:flex}
.report{display:flex;flex-direction:column;flex:1;min-width:0;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow-lg);overflow:hidden;min-height:0;max-height:680px}
.report.is-flash{animation:flash 1.2s ease}
@keyframes flash{0%,100%{box-shadow:var(--shadow-lg)}30%{box-shadow:0 0 0 3px rgba(242,100,25,.35),var(--shadow-lg)}}
.rp-top{display:flex;align-items:center;gap:10px;padding:18px 24px 0;flex-wrap:wrap}
.rp-kicker{font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--orange-d)}
.rp-when{margin-left:auto;font-family:var(--mono);font-size:11.5px;color:var(--muted)}
.rp-sel{margin-left:auto;height:30px;max-width:230px;border:1px solid var(--line);border-radius:8px;background:var(--cream-2);color:var(--sub);font-size:11.5px;font-weight:700;padding:0 8px}
.rp-nav{display:inline-flex;align-items:center;gap:4px;color:var(--muted);font-family:var(--mono);font-size:11px}
.rp-nav button{width:24px;height:24px;border-radius:7px;border:1px solid var(--line);background:#fff;display:grid;place-items:center;color:var(--sub);font-size:14px;line-height:1}
.rp-nav button:hover{border-color:var(--navy);color:var(--ink)}
.rp-title{padding:8px 24px 0;font-size:23px;line-height:1.32;font-weight:800;letter-spacing:-.035em;color:var(--navy);word-break:break-word}
.rp-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 24px 0;font-size:12px;font-weight:700;color:var(--muted)}
.rp-meta .dotsep{width:3px;height:3px;border-radius:50%;background:var(--line-2)}
.rp-status{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:800}
.rp-status::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--muted)}
.rp-status.s-review{color:var(--orange-d)} .rp-status.s-review::before{background:var(--orange)}
.rp-status.s-done{color:var(--green)} .rp-status.s-done::before{background:var(--green)}
.rp-status.s-error{color:var(--red)} .rp-status.s-error::before{background:var(--red)}
.rp-tabs{display:flex;gap:2px;flex-wrap:wrap;padding:14px 24px 0;border-bottom:1px solid var(--line);margin-top:12px}
.rp-tabs button{position:relative;padding:0 11px 9px;font-size:12.5px;font-weight:800;color:var(--muted);white-space:nowrap}
.rp-tabs button:hover{color:var(--ink)}
.rp-tabs button.is-on{color:var(--navy)}
.rp-tabs button.is-on::after{content:"";position:absolute;left:8px;right:8px;bottom:-1px;height:2.5px;border-radius:2px 2px 0 0;background:var(--orange)}
.rp-body{flex:1;min-height:0;overflow:auto;overscroll-behavior:contain;padding:20px 24px 8px;font-size:15.5px;line-height:1.85;color:#243745}
.rp-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:13px 24px 16px;border-top:1px solid var(--line);background:linear-gradient(180deg,#fffdfa,#fdfaf4)}
.rp-actions .btn-ok{background:var(--green);color:#fff;border:1px solid var(--green)}
.rp-actions .btn-ok:hover{background:#17724c}
.rp-actions .btn-no{background:#fff;border:1px solid var(--line-2);color:#93412f}
.rp-actions .btn-no:hover{border-color:#c9403e;color:#a8322f}
.rp-actions .rp-all{margin-left:auto;font-size:12px;font-weight:800;color:var(--orange-d)}
.rp-empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:40px 24px;text-align:center;color:var(--muted)}
.rp-empty-mark{width:54px;height:54px;border-radius:16px;background:var(--cream-2);border:1px solid var(--line);display:grid;place-items:center;color:#b9a98f}
.rp-empty b{font-size:15px;font-weight:800;color:var(--sub)}
.rp-live{padding:22px 24px 10px;display:flex;flex-direction:column;gap:10px}
.rp-live-head{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:800;color:var(--navy)}
.rp-live-stage{font-size:12.5px;font-weight:800;color:var(--blue)}
.rp-live-bar{display:flex;gap:4px}
.rp-live-bar i{flex:1;height:4px;border-radius:2px;background:#e7ecef}
.rp-live-bar i.on{background:var(--blue)}
.rp-live-bar i.now{background:var(--orange);animation:pulseBar 1.3s ease-in-out infinite}
.rp-live-detail{font-size:13.5px;line-height:1.6;color:var(--sub)}
.rp-live-instr{margin:4px 24px 0;padding:11px 14px;border-radius:11px;background:var(--cream-2);border:1px solid var(--line);font-size:12.5px;line-height:1.65;color:#4c5f6c}
.rp-clock{margin-left:auto;font-family:var(--mono);font-size:12px;font-weight:800;color:var(--blue)}

/* 본문 문서 */
.rp-body h4,.sheet-body h4{margin:22px 0 8px;font-size:15px;font-weight:800;color:var(--navy);letter-spacing:-.01em}
.rp-body h4:first-child,.sheet-body h4:first-child{margin-top:0}
.rp-body p,.sheet-body p{margin:0 0 9px}
.rp-body ul,.sheet-body ul{margin:2px 0 12px;padding-left:2px}
.rp-body li,.sheet-body li{position:relative;padding-left:15px;margin:3px 0}
.rp-body li::before,.sheet-body li::before{content:"";position:absolute;left:3px;top:.72em;width:5px;height:5px;border-radius:50%;background:var(--orange);opacity:.75}
.rp-body b,.sheet-body b{font-weight:800;color:var(--navy)}
.hr-item{display:flex;gap:9px;margin:4px 0}
.hr-item i{font-style:normal;font-weight:800;color:var(--orange-d);flex:none}
.hr-table-wrap{overflow-x:auto;margin:10px 0 16px;border:1px solid var(--line);border-radius:12px}
.hr-table{width:100%;border-collapse:collapse;font-size:13.8px;line-height:1.55;background:#fff}
.hr-table th{background:#f8f4ec;color:#5a6b77;font-weight:800;text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
.hr-table td{padding:9px 12px;border-bottom:1px solid #f1ebe0;vertical-align:top;color:#2c3f4c}
.hr-table tr:last-child td{border-bottom:0}
.hr-table td:first-child,.hr-table th:first-child{color:var(--navy);font-weight:700}
.ins-list{display:flex;flex-direction:column;gap:7px}
.ins-row{display:grid;grid-template-columns:110px minmax(0,1fr);gap:10px;background:var(--cream-2);border:1px solid var(--line);border-radius:10px;padding:9px 12px;font-size:13.5px;line-height:1.65}
.ins-row b{font-size:12px;color:var(--orange-d)}
.rp-block{padding:12px 0;border-top:1px dashed var(--line)}
.rp-block:first-child{border-top:0;padding-top:0}
.rp-block h5{margin:0 0 4px;font-size:13px;font-weight:800;color:var(--navy)}
.rp-block pre{margin:0;font-family:inherit;font-size:14px;line-height:1.75;color:#334855;white-space:pre-wrap;word-break:break-word}
.rp-mini{color:var(--muted);font-size:13px;line-height:1.6}

/* ============ section heads ============ */
.sec{padding:38px 0}
.sec-head{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;flex-wrap:wrap;margin-bottom:16px}
.sec-head h2{font-size:21px;font-weight:800;letter-spacing:-.03em;color:var(--navy);display:flex;align-items:baseline;gap:8px}
.sec-head h2 em{font-style:normal;font-family:var(--mono);font-size:14px;color:var(--muted);font-weight:700}
.sec-tools{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.live-count,.idle-count{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:800;color:var(--sub)}
.live-count i{width:7px;height:7px;border-radius:50%;background:var(--orange);box-shadow:0 0 0 3px rgba(242,100,25,.15);animation:pulseDot 1.6s ease-in-out infinite}
.idle-count i{width:7px;height:7px;border-radius:50%;background:#b9c3cb}
.live-count b,.idle-count b{font-family:var(--mono);font-size:13px;color:var(--navy)}

/* ============ 3D office ============ */
.office-sec{background:linear-gradient(180deg,var(--cream) 0%,#f1ece2 100%);border-top:1px solid rgba(0,0,0,.03)}
.stage{position:relative;border-radius:26px;box-shadow:0 40px 90px -46px rgba(72,48,18,.55),0 2px 0 rgba(255,255,255,.8) inset;isolation:isolate}
.stage::after{content:"";position:absolute;inset:0;border-radius:26px;border:1px solid rgba(120,88,48,.16);pointer-events:none;z-index:6}
.stage-img{width:100%;height:auto;border-radius:26px;display:block;background:#f7f2e8}
.office-floor{position:absolute;inset:0;z-index:4;pointer-events:none}
.desk{position:absolute;left:var(--x);top:var(--y);transform:translate(-50%,-50%);pointer-events:auto;display:flex;flex-direction:column;align-items:center;gap:0;z-index:2}
.desk-glow{position:absolute;left:50%;top:50%;width:74px;height:44px;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(closest-side,rgba(255,170,80,.55),rgba(255,170,80,0) 72%);opacity:0;transition:opacity .3s;pointer-events:none}
.desk-dot{position:relative;width:19px;height:19px;border-radius:50%;background:rgba(255,253,248,.94);border:1.5px solid rgba(120,88,48,.35);display:grid;place-items:center;font-family:var(--mono);font-size:8.5px;font-weight:800;color:#7a6a54;box-shadow:0 2px 6px rgba(60,40,10,.25);transition:.2s}
.desk-name{margin-top:3px;padding:2px 6px;border-radius:6px;background:rgba(255,253,248,.94);border:1px solid rgba(120,88,48,.18);font-size:9px;font-weight:800;color:#5d6b77;white-space:nowrap;box-shadow:0 2px 6px rgba(60,40,10,.16);transition:.2s}
.desk:hover .desk-dot{background:var(--navy);border-color:var(--navy);color:#fff;transform:scale(1.12)}
.desk:hover .desk-name{background:var(--navy);color:#fff;border-color:var(--navy)}
.desk-bub{position:absolute;left:50%;bottom:calc(100% + 4px);transform:translate(-50%,4px);display:none;align-items:center;gap:5px;max-width:190px;padding:5px 9px;border-radius:9px;background:#fffdf8;border:1px solid rgba(120,88,48,.22);box-shadow:0 8px 20px -10px rgba(60,40,10,.5);font-size:10px;font-weight:800;color:#33424d;line-height:1.3;white-space:nowrap;z-index:5}
.desk-bub::after{content:"";position:absolute;left:50%;bottom:-5px;margin-left:-4px;border:4px solid transparent;border-top-color:#fffdf8;border-bottom:0}
.desk-bub b{overflow:hidden;text-overflow:ellipsis;max-width:150px}
.desk-bub .dots{display:inline-flex;gap:2px;flex:none}
.desk-bub .dots b{width:3px;height:3px;border-radius:50%;background:var(--orange);animation:typeDot 1.1s ease-in-out infinite}
.desk-bub .dots b:nth-child(2){animation-delay:.15s}
.desk-bub .dots b:nth-child(3){animation-delay:.3s}
.desk.is-active{z-index:5}
.desk.is-active .desk-glow{opacity:1;animation:glowPulse 2.6s ease-in-out infinite}
.desk.is-active .desk-dot{background:var(--orange);border-color:#fff;color:#fff;box-shadow:0 0 0 4px rgba(242,100,25,.22),0 0 14px rgba(242,100,25,.7)}
.desk.is-active .desk-name{background:var(--orange);color:#fff;border-color:var(--orange)}
.desk.is-active .desk-bub{display:inline-flex;animation:bubFloat 2.4s ease-in-out infinite}
.desk.is-active:hover .desk-bub{background:#fff}
/* 구역 라벨 */
.zone{position:absolute;left:var(--zx);top:var(--zy);width:var(--zw);height:var(--zh);border:1.6px dashed rgba(255,253,246,.85);border-radius:20px;pointer-events:auto;transition:background .2s,border-color .2s}
.zone:hover{background:rgba(255,255,255,.12);border-color:#fff}
.zone-label{position:absolute;left:8px;top:8px;display:inline-flex;align-items:center;gap:6px;padding:4px 10px 4px 8px;border-radius:999px;background:rgba(255,253,248,.94);border:1px solid rgba(120,88,48,.18);font-size:10.5px;font-weight:800;color:#4f5f6b;box-shadow:0 4px 12px -6px rgba(60,40,10,.5);white-space:nowrap}
.zone-label i{width:6px;height:6px;border-radius:50%;background:var(--orange);flex:none}
.zone:hover .zone-label{background:#fff;color:var(--navy)}
/* 부서 레일 */
.dept-rail{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin-top:14px}
.rail{display:flex;align-items:center;gap:8px;padding:10px 11px;background:var(--card);border:1px solid var(--line);border-radius:12px;text-align:left;transition:.16s;min-width:0}
.rail:hover{border-color:var(--orange);transform:translateY(-1px);box-shadow:var(--shadow)}
.rail-no{flex:none;font-family:var(--mono);font-size:10px;font-weight:800;color:#8a7960;background:var(--cream-2);border:1px solid var(--line);border-radius:6px;padding:2px 5px}
.rail-txt{min-width:0;flex:1}
.rail-txt b{display:block;font-size:12px;font-weight:800;color:var(--navy);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rail-txt span{display:block;font-size:10.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rail-lamp{flex:none;width:7px;height:7px;border-radius:50%;background:#c6cfd6}
.rail.is-working{border-color:#f6cdb5;background:linear-gradient(180deg,#fff9f4,#fff)}
.rail.is-working .rail-lamp{background:var(--orange);box-shadow:0 0 0 3px rgba(242,100,25,.16);animation:pulseDot 1.4s ease-in-out infinite}
.rail.is-working .rail-txt span{color:var(--orange-d);font-weight:800}
/* 부서 추가 */
.dept-add{margin-top:12px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;box-shadow:var(--shadow)}
.dept-add[hidden]{display:none}
.da-row{display:flex;flex-wrap:wrap;gap:9px}
.da-row + .da-row{margin-top:9px}
.dept-add label,.dept-edit label{display:flex;flex-direction:column;gap:3px;flex:1 1 180px;min-width:0;font-size:10px;font-weight:800;color:#7a8893;letter-spacing:.02em}
.dept-add input,.dept-add select,.dept-edit input,.dept-edit select{width:100%;height:34px;border:1px solid var(--line-2);border-radius:8px;padding:0 9px;font-size:12.5px;font-weight:600;color:var(--ink);background:var(--cream-2)}
.dept-add input:focus,.dept-edit input:focus{outline:none;border-color:var(--orange);background:#fff;box-shadow:0 0 0 3px rgba(242,100,25,.12)}

/* ============ board ============ */
.board-sec{padding-bottom:60px}
.board-tools{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.board-tools .danger{color:#a8322f}
.board-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;align-items:start}
.col{background:#efe9de;border:1px solid #e6ddcd;border-radius:16px;padding:9px;min-height:160px;min-width:0}
.col-head{display:flex;align-items:center;gap:7px;padding:2px 4px 9px;font-size:12px;font-weight:800;color:#4c5f6c}
.col-head i{width:7px;height:7px;border-radius:50%;flex:none}
.col[data-status="wait"] .col-head i{background:#93a0a9}
.col[data-status="doing"] .col-head i{background:var(--blue)}
.col[data-status="review"] .col-head i{background:var(--orange)}
.col[data-status="done"] .col-head i{background:var(--green)}
.col[data-status="error"] .col-head i{background:var(--red)}
.col-count{margin-left:auto;background:rgba(255,255,255,.8);border:1px solid #e3dacb;border-radius:999px;min-width:20px;height:18px;display:grid;place-items:center;font-size:10px;font-weight:800;color:#69777f;font-family:var(--mono);padding:0 5px}
.col-empty{border:1px dashed #d6cbb8;border-radius:10px;padding:14px 8px;text-align:center;font-size:10.5px;color:#9aa4ab;line-height:1.5}
.task{position:relative;background:#fff;border:1px solid #e6ddcd;border-radius:13px;padding:11px 11px 9px;margin-bottom:8px;box-shadow:0 1px 2px rgba(60,42,20,.04);cursor:pointer;transition:box-shadow .16s,transform .16s,border-color .16s}
.task:hover{box-shadow:0 14px 28px -20px rgba(60,42,20,.55);transform:translateY(-1px);border-color:#d9c8ad}
.task.is-flash{border-color:var(--orange);box-shadow:0 0 0 3px rgba(242,100,25,.2)}
.task-top{display:flex;align-items:center;gap:5px;min-width:0}
.t-no{flex:none;font-family:var(--mono);font-size:9.5px;font-weight:800;color:#7d6c53;background:var(--cream-2);border:1px solid var(--line);border-radius:5px;padding:1px 4px}
.t-dept{font-size:10px;font-weight:800;color:#7c8a94;letter-spacing:-.01em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.t-status{margin-left:auto;flex:none;font-size:9px;font-weight:800;border-radius:99px;padding:1px 6px;background:#f0f3f6;color:#5a6b78}
.t-status.doing{background:var(--blue-tint);color:#1a5399}
.t-status.review{background:var(--orange-tint);color:var(--orange-d)}
.t-status.done{background:var(--green-tint);color:#146d47}
.t-status.error{background:var(--red-tint);color:#a8322f}
.task h4{margin-top:7px;font-size:13px;font-weight:800;letter-spacing:-.02em;color:var(--navy);line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}
.t-sum{margin-top:4px;font-size:11.5px;line-height:1.55;color:#63727d;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}
.task-foot{display:flex;align-items:center;gap:6px;margin-top:8px;padding-top:7px;border-top:1px solid #f2ece1;min-height:22px}
.t-time{font-family:var(--mono);font-size:10px;font-weight:700;color:#93a0a9}
.t-who{font-size:10px;font-weight:800;color:#7c8a94;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:84px}
.t-live-mini{display:inline-flex;align-items:center;gap:4px;font-family:var(--mono);font-size:10px;font-weight:800;color:var(--blue)}
.t-live-mini i{width:5px;height:5px;border-radius:50%;background:var(--blue);animation:pulseDot 1.2s ease-in-out infinite}
.t-acts{margin-left:auto;display:flex;gap:2px;opacity:0;transition:opacity .15s}
.task:hover .t-acts,.task:focus-within .t-acts{opacity:1}
.t-acts button{width:24px;height:22px;border-radius:6px;display:grid;place-items:center;color:#8a97a1;border:1px solid transparent}
.t-acts button:hover{background:var(--cream-2);border-color:var(--line);color:var(--navy)}
.t-acts button svg{width:13px;height:13px}

/* ============ modal (task) ============ */
.modal{position:fixed;inset:0;z-index:90;display:flex;align-items:center;justify-content:center;padding:22px}
.modal[hidden]{display:none}
.modal-bg{position:absolute;inset:0;background:rgba(18,28,36,.46);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.sheet{position:relative;width:min(900px,100%);max-height:88vh;display:flex;flex-direction:column;background:var(--paper);border-radius:22px;box-shadow:0 50px 100px -40px rgba(0,0,0,.6);overflow:hidden;animation:sheetIn .22s ease}
@keyframes sheetIn{from{opacity:0;transform:translateY(10px) scale(.99)}to{opacity:1;transform:none}}
.sheet-head{position:relative;padding:20px 26px 14px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,#fffdfa,#fdfaf4)}
.sheet-close{position:absolute;right:18px;top:18px;width:30px;height:30px;border-radius:9px;display:grid;place-items:center;color:var(--muted);border:1px solid transparent}
.sheet-close:hover{background:#fff;border-color:var(--line);color:var(--ink)}
.sheet-kicker{display:flex;align-items:center;gap:7px;font-size:11px;font-weight:800;color:#8a7960;letter-spacing:.04em}
.sheet-kicker .no{font-family:var(--mono);background:var(--cream-2);border:1px solid var(--line);border-radius:5px;padding:1px 5px;color:#7a6a54}
.sheet-title{margin-top:6px;font-size:21px;line-height:1.3;font-weight:800;letter-spacing:-.03em;color:var(--navy);padding-right:34px;word-break:break-word}
.sheet-meta{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:9px;font-size:11.5px;font-weight:700;color:var(--muted)}
.sheet-meta select{height:27px;max-width:180px;border:1px solid var(--line);border-radius:7px;background:#fff;font-size:11px;font-weight:700;color:var(--sub);padding:0 6px}
.sheet-tabs{display:flex;gap:2px;flex-wrap:wrap;padding:10px 26px 0;border-bottom:1px solid var(--line);background:#fdfaf4}
.sheet-tabs button{position:relative;padding:0 10px 9px;font-size:12px;font-weight:800;color:var(--muted);white-space:nowrap}
.sheet-tabs button.is-on{color:var(--navy)}
.sheet-tabs button.is-on::after{content:"";position:absolute;left:7px;right:7px;bottom:-1px;height:2.5px;border-radius:2px 2px 0 0;background:var(--orange)}
.sheet-body{flex:1;min-height:120px;overflow:auto;padding:18px 26px;font-size:14.8px;line-height:1.8;color:#2a3d49;overscroll-behavior:contain}
.sheet-foot{display:flex;align-items:center;gap:7px;flex-wrap:wrap;padding:12px 26px 16px;border-top:1px solid var(--line);background:#fdfaf4}
.sheet-foot .btn{height:36px;padding:0 13px;font-size:12px;border-radius:9px}
.sheet-foot .spacer{flex:1}
.sheet-foot .danger{color:#a8322f}
.sheet-note{margin-top:8px;font-size:12.5px;color:var(--muted)}
.sheet-instr{margin-top:8px;padding:11px 13px;border-radius:10px;background:var(--cream-2);border:1px solid var(--line);font-size:13px;line-height:1.7;color:#455966;white-space:pre-wrap;word-break:break-word}

/* ============ drawer ============ */
.drawer-wrap{position:fixed;inset:0;z-index:80}
.drawer-wrap[hidden]{display:none}
.drawer-bg{position:absolute;inset:0;background:rgba(18,28,36,.4);backdrop-filter:blur(2px)}
.drawer{position:absolute;right:0;top:0;bottom:0;width:min(540px,94vw);display:flex;flex-direction:column;background:var(--paper);box-shadow:-30px 0 80px -50px rgba(0,0,0,.6);animation:drawerIn .24s ease}
@keyframes drawerIn{from{transform:translateX(24px);opacity:.6}to{transform:none;opacity:1}}
.dw-head{display:flex;align-items:flex-start;gap:12px;padding:20px 22px 14px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,#fffdfa,#fdfaf4)}
.dw-no{flex:none;font-family:var(--mono);font-size:12px;font-weight:800;color:#fff;background:var(--navy);border-radius:7px;padding:3px 7px}
.dw-title{flex:1;min-width:0}
.dw-kicker{font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.dw-title h2{margin-top:2px;font-size:20px;font-weight:800;letter-spacing:-.03em;color:var(--navy);line-height:1.3}
.dw-title p{display:none}
.dw-close{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:var(--muted);flex:none;border:1px solid transparent}
.dw-close:hover{background:#fff;border-color:var(--line);color:var(--ink)}
.dw-body{flex:1;overflow:auto;padding:6px 22px 16px;overscroll-behavior:contain}
.dw-sec{padding:16px 0;border-bottom:1px solid #f1ebe0}
.dw-sec:last-child{border-bottom:0}
.dw-sec h3{display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:800;color:var(--navy);letter-spacing:-.01em;margin-bottom:9px}
.dw-sec h3 i{width:5px;height:5px;border-radius:50%;background:var(--orange);flex:none}
.dw-sec-n{margin-left:auto;font-size:10.5px;font-weight:800;color:var(--muted)}
.dw-lead{font-size:13px;line-height:1.75;color:#4b5f6c}
.dw-lead b{color:var(--navy)}
.tools-grid{display:flex;flex-wrap:wrap;gap:5px}
.dw-list{display:grid;gap:4px;font-size:12.5px;color:#4b5f6c}
.dw-list li{position:relative;padding-left:12px}
.dw-list li::before{content:"";position:absolute;left:1px;top:.68em;width:4px;height:4px;border-radius:50%;background:#c2ab8a}
.tl{display:flex;flex-direction:column;gap:6px}
.tl li{display:grid;grid-template-columns:62px 1fr;gap:8px;font-size:12.5px;line-height:1.6}
.tl time{font-family:var(--mono);font-size:10.5px;font-weight:800;color:var(--orange-d);padding-top:2px}
.kpi-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.kpi{background:var(--cream-2);border:1px solid var(--line);border-radius:9px;padding:7px 9px}
.kpi span{display:block;font-size:10px;font-weight:800;color:var(--muted)}
.kpi b{display:block;font-size:13px;font-weight:800;color:var(--navy)}
.dw-note{margin-top:8px;padding:9px 11px;border-radius:9px;background:var(--orange-tint);border:1px solid #f7d9c5;font-size:11.5px;line-height:1.6;color:#8a4a20}
.dw-linkage{font-size:12px;line-height:1.7;color:var(--muted)}
.staff-list{display:flex;flex-direction:column;gap:7px}
.staff{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 11px}
.staff-top{display:flex;align-items:center;gap:8px}
.staff-av{width:28px;height:28px;border-radius:50%;background:var(--cream-2);border:1px solid var(--line);display:grid;place-items:center;font-size:12px;font-weight:800;color:#7a6a54;flex:none}
.staff-id{flex:1;min-width:0}
.staff-id b{display:block;font-size:12.5px;font-weight:800;color:var(--navy);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.staff-id span{display:block;font-size:10.5px;color:var(--muted)}
.staff-load{flex:none;font-size:10px;font-weight:800;color:var(--blue);background:var(--blue-tint);border-radius:99px;padding:2px 7px}
.staff-load.is-zero{color:var(--muted);background:var(--cream-2)}
.staff-task{margin-top:6px;font-size:11.5px;line-height:1.55;color:#62727d}
.staff-acts{display:flex;gap:4px;margin-top:8px;flex-wrap:wrap}
.staff-acts button{height:27px;padding:0 9px;border-radius:7px;border:1px solid var(--line-2);background:#fff;font-size:10.5px;font-weight:800;color:#5b6b77}
.staff-acts button:hover{border-color:var(--navy);color:var(--navy)}
.staff-acts button.is-del{color:#a8322f;border-color:#f0d3c6;background:#fff8f6}
.staff-empty{padding:14px;border:1px dashed var(--line-2);border-radius:10px;font-size:11.5px;color:var(--muted);line-height:1.6;text-align:center}
.staff-add{width:100%;height:32px;margin-top:8px;border:1px dashed var(--line-2);border-radius:9px;background:var(--cream-2);font-size:11.5px;font-weight:800;color:#6b7a85}
.staff-add:hover{border-color:var(--orange);color:var(--orange-d)}
.staff-form{display:flex;flex-direction:column;gap:4px;margin-top:9px;padding:11px;background:#fff;border:1px solid var(--line);border-radius:11px}
.staff-form[hidden]{display:none}
.staff-form label{font-size:9.5px;font-weight:800;color:#7a8893;margin-top:3px}
.staff-form input{height:32px;border:1px solid var(--line-2);border-radius:8px;padding:0 8px;font-size:12px;background:var(--cream-2)}
.staff-form input:focus{outline:none;border-color:var(--orange);background:#fff}
.f-acts{display:flex;gap:5px;margin-top:8px}
.f-acts .btn{height:32px;font-size:11.5px;padding:0 12px}
.dw-foot{display:flex;align-items:center;gap:6px;padding:12px 22px 15px;border-top:1px solid var(--line);background:#fdfaf4}
.dw-foot .btn{height:36px;font-size:12px;padding:0 12px;border-radius:9px}
.dw-nav{display:flex;gap:3px}
.dw-nav button{width:29px;height:29px;border-radius:8px;border:1px solid var(--line);background:#fff;display:grid;place-items:center;color:var(--sub)}
.dw-nav button:hover{border-color:var(--navy);color:var(--ink)}
.dw-foot #dwCopy{margin-left:auto}
.dw-sec .dept-edit{gap:7px}
.de-row{display:flex;gap:5px;flex-wrap:wrap;margin-top:2px}
.de-row button{height:29px;padding:0 10px;border-radius:7px;border:1px solid var(--line-2);background:#fff;font-size:11px;font-weight:800;color:#5b6b77}
.de-row button.save{background:var(--navy);border-color:var(--navy);color:#fff}
.de-row button.is-del{color:#a8322f;border-color:#f0d3c6;background:#fff8f6}

/* ============ PC modal ============ */
.pcm-wrap{position:fixed;inset:0;z-index:95;display:flex;align-items:center;justify-content:center;padding:22px}
.pcm-wrap[hidden]{display:none}
.pcm-bg{position:absolute;inset:0;background:rgba(18,28,36,.45);backdrop-filter:blur(3px)}
.pcm{position:relative;width:min(520px,100%);background:var(--paper);border-radius:20px;box-shadow:0 50px 100px -40px rgba(0,0,0,.6);overflow:hidden}
.pcm-head{display:flex;align-items:flex-start;gap:12px;padding:20px 22px 14px;border-bottom:1px solid var(--line)}
.pcm-head h2{font-size:18px;font-weight:800;letter-spacing:-.03em;color:var(--navy)}
.pcm-head p{margin-top:2px;font-size:11.5px;color:var(--muted);line-height:1.5}
.pcm-x{margin-left:auto;width:28px;height:28px;border-radius:8px;color:var(--muted);display:grid;place-items:center;flex:none}
.pcm-x:hover{background:#fff;border:1px solid var(--line);color:var(--ink)}
.pcm-body{padding:16px 22px 20px;display:flex;flex-direction:column;gap:5px}
.pcm-body label{font-size:10px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin-top:5px}
.pcm-body label span{text-transform:none;letter-spacing:0;font-weight:700;color:#a3afb7}
.pcm-body input{height:38px;border:1px solid var(--line-2);border-radius:9px;padding:0 11px;font-size:13px;background:var(--cream-2);font-family:var(--mono)}
.pcm-body input:focus{outline:none;border-color:var(--orange);background:#fff;box-shadow:0 0 0 3px rgba(242,100,25,.12)}
.pcm-acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.pcm-acts .btn{height:36px;font-size:12px;padding:0 13px;border-radius:9px}
.pcm-state{margin-top:12px;padding:10px 12px;border-radius:9px;background:var(--cream-2);border:1px solid var(--line);font-size:11.5px;line-height:1.6;color:#4b5f6c}
.pcm-state[data-live="on"]{background:var(--green-tint);border-color:#c6e7d6;color:#146d47}
.pcm-state[data-live="checking"]{background:#fff8ea;border-color:#f3e0b6;color:#8a6114}
.pcm-how,.pcm-warn{display:none}
.pcm-sec{margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.pcm-sec h3{font-size:12.5px;font-weight:800;color:var(--navy);letter-spacing:-.01em}
.pcm-sec h3 em{font-style:normal;font-weight:700;font-size:10.5px;color:var(--muted);margin-left:6px}
.sync-pill[data-live="on"]{color:#1c5a8a;border-color:#c4dced;background:#f3f9fd}
.sync-pill[data-live="on"]::before{background:#2f7fb8;box-shadow:0 0 0 3px rgba(47,127,184,.14)}

/* ============ toast / footer ============ */
.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,14px);z-index:120;max-width:min(520px,90vw);padding:11px 16px;border-radius:12px;background:rgba(20,38,53,.95);color:#fff;font-size:12.5px;font-weight:700;line-height:1.5;box-shadow:0 20px 50px -20px rgba(0,0,0,.6);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;text-align:center}
.toast.is-on{opacity:1;transform:translate(-50%,0)}
.foot{padding:22px 0 30px;border-top:1px solid var(--line);background:var(--cream)}
.foot-in{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:10.5px;color:#97a2aa;font-family:var(--mono);letter-spacing:.02em}

/* ============ misc ============ */
.spin{display:inline-block;width:11px;height:11px;flex:none;border-radius:50%;border:2px solid rgba(37,99,176,.22);border-top-color:var(--blue);animation:spinRing .75s linear infinite}
@keyframes spinRing{to{transform:rotate(360deg)}}
@keyframes pulseDot{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.82)}}
@keyframes pulseBar{0%,100%{opacity:1}50%{opacity:.45}}
@keyframes glowPulse{0%,100%{opacity:.55}50%{opacity:1}}
@keyframes bubFloat{0%,100%{transform:translate(-50%,0)}50%{transform:translate(-50%,-3px)}}
@keyframes typeDot{0%,100%{opacity:.25;transform:translateY(0)}50%{opacity:1;transform:translateY(-2px)}}
@keyframes pop{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}

/* ============ responsive ============ */
@media (max-width:1180px){
  .hero-grid{grid-template-columns:minmax(310px,360px) minmax(0,1fr)}
  .board-grid{grid-template-columns:repeat(5,minmax(190px,1fr));overflow-x:auto;padding-bottom:6px}
}
@media (max-width:980px){
  .hero-grid{grid-template-columns:1fr}
  .report{min-height:480px;max-height:none}
  .nav{display:none}
  .dept-rail{grid-template-columns:repeat(3,minmax(0,1fr))}
}
@media (max-width:760px){
  :root{--head:56px}
  .wrap{padding:0 16px}
  .hero{padding:18px 0 24px}
  .top-in{gap:12px}
  .brand-sub{display:none}
  .clock{display:none}
  .sync-pill{display:none}
  .cmd{padding:14px}
  .cmd textarea{min-height:120px;font-size:15.5px}
  .report{min-height:0;max-height:none}
  .rp-top{padding:15px 17px 0}
  .rp-title{padding:7px 17px 0;font-size:19px}
  .rp-meta{padding:7px 17px 0}
  .rp-tabs{padding:11px 17px 0;overflow-x:auto;flex-wrap:nowrap}
  .rp-body{padding:16px 17px 6px;font-size:15px;max-height:440px}
  .rp-actions{padding:11px 17px 14px}
  .rp-actions .btn{height:38px;font-size:13px}
  .stage{border-radius:18px}
  .stage-img{border-radius:18px}
  .stage::after{border-radius:18px}
  .zone{display:none}
  .desk-name{display:none}
  .desk-dot{width:15px;height:15px;font-size:7px}
  .desk-bub{max-width:130px;font-size:9px;padding:4px 7px}
  .desk-bub b{max-width:96px}
  .dept-rail{grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
  .rail{padding:8px 8px;gap:6px}
  .rail-no{display:none}
  .rail-txt b{font-size:10.5px}
  .rail-txt span{font-size:9px}
  .board-grid{grid-template-columns:repeat(5,minmax(238px,238px));overflow-x:auto;scroll-snap-type:x proximity;padding:0 2px 10px}
  .col{scroll-snap-align:start}
  .task{padding:10px}
  .t-acts{opacity:1}
  .modal{padding:0;align-items:flex-end}
  .sheet{max-height:92vh;border-radius:20px 20px 0 0}
  .sheet-head{padding:17px 18px 12px}
  .sheet-title{font-size:18px}
  .sheet-tabs{padding:9px 18px 0;overflow-x:auto;flex-wrap:nowrap}
  .sheet-body{padding:15px 18px;font-size:14.5px}
  .sheet-foot{padding:11px 18px 14px}
  .drawer{width:100vw}
  .dw-head{padding:17px 18px 12px}
  .dw-body{padding:4px 18px 14px}
  .dw-foot{padding:10px 18px 13px}
  .sec{padding:28px 0}
  .sec-head h2{font-size:19px}
  .foot{padding:16px 0 22px}
}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important}
}


/* v2 fixes */
.office-zones{position:absolute;inset:0;z-index:3;pointer-events:none}
.office-zones .zone{pointer-events:auto}
.rp-body pre,.sheet-body pre{margin:0;font-family:inherit;font-size:14.6px;line-height:1.85;white-space:pre-wrap;word-break:break-word;color:#2a3d49}

.btn-ok{background:var(--green);color:#fff;border:1px solid var(--green)}

<body>
<header class="top">

<main>
  <section class="hero" id="command">
    <div class="wrap hero-grid">
      <div class="cmd-col">

            <textarea id="cmdText" rows="4" placeholder="예) 인스타 릴스 기획안 만들어줘 — 바로 촬영할 수 있게 표로"></textarea>

              <button type="button" class="preset" data-preset="인스타 릴스 기획안 만들어줘 — 바로 촬영할 수 있게 시간·화면·대사 표로">릴스 기획안</button>
              <button type="button" class="preset" data-preset="이번 달 전환율이랑 매출 리포트 갱신해줘">매출 리포트</button>

  var ART_KEYS = ["video","upload","channels","brief","insta","score","spy","funnel","report"];
  var CATS = [{k:"content",n:"콘텐츠"},{k:"inflow",n:"유입"},{k:"convert",n:"전환"},{k:"ops",n:"운영"}];

  function deptNextNo(){
    var used = {};
    DEPTS.forEach(function(d){ var n = parseInt(d.no, 10); if(isFinite(n)) used[n] = 1; });
    for(var i = 1; i < 100; i++){ if(!used[i]) return i < 10 ? ("0" + i) : String(i); }
    return String(DEPTS.length + 1);
  }

  function normalizeDept(d){
    d = d || {};
    var o = {};
    o.no = String(d.no || "").slice(0, 4);
    o.title = String(d.title || "새 부서").slice(0, 24);
    o.cat = CAT[d.cat] ? d.cat : "ops";
    o.art = ART_KEYS.indexOf(d.art) > -1 ? d.art : "brief";
    o.one = String(d.one || "").slice(0, 140);
    o.lead = String(d.lead || o.one || "").slice(0, 800);
    o.tools = Array.isArray(d.tools) ? d.tools.filter(Boolean).map(String).slice(0, 6) : [];
    o.outputs = Array.isArray(d.outputs) ? d.outputs.filter(Boolean).map(String).slice(0, 6) : [];
    o.kpis = Array.isArray(d.kpis) ? d.kpis.slice(0, 6) : [];
    o.routine = Array.isArray(d.routine) ? d.routine.slice(0, 8) : [];
    o.link = String(d.link || "");
    o.note = String(d.note || "");
    o.kw = Array.isArray(d.kw) ? d.kw.filter(Boolean).map(String).slice(0, 20) : [];
    return o;
  }

  function deptKwText(d){ return (d.kw || []).join(", "); }

  function splitList(s){
    return String(s || "").split(/[,\n]/).map(function(x){ return x.trim(); }).filter(Boolean);

  function addDept(title, one, cat, kw, tools){
    title = String(title || "").trim();
    if(!title){ showToast("부서 이름을 적어 주세요"); return null; }
    if(DEPTS.length >= 30){ showToast("부서는 30개까지 만들 수 있습니다"); return null; }
    var d = normalizeDept({
      no: deptNextNo(), title: title, one: one || (title + " 업무를 맡습니다"),
      cat: cat || "ops", art: ART_KEYS[DEPTS.length % ART_KEYS.length],
      tools: tools, outputs: ["결과 보고서", "실행 로그"],
      lead: (one || title) + " — 대표님 지시가 들어오면 이 부서가 맡아 실행합니다.",
      routine: [], kpis: [["납기", "당일"], ["재작업", "1회 이하"]],
      link: "결과는 총괄 비서 컨펌을 거쳐 대표님께 보고됩니다.", kw: kw
    });
    DEPTS.push(d);
    if(!state.staff) state.staff = staffDefaults();
    state.staff[d.no] = state.staff[d.no] || [];
    save(); renderAll();
    showToast(d.no + " " + d.title + " 부서를 만들었습니다 — 부서를 눌러 직원을 넣어 주세요");
    return d;
  }

  function updateDept(no, patch){
    var d = deptByNo(no);
    if(!d) return;
    var nw = normalizeDept({
      no:d.no, title: patch.title != null ? patch.title : d.title,
      cat: patch.cat || d.cat, art: d.art,
      one: patch.one != null ? patch.one : d.one,
      lead: patch.lead != null ? patch.lead : d.lead,
      tools: patch.tools || d.tools, outputs: patch.outputs || d.outputs,
      kpis: d.kpis, routine: d.routine, link: d.link, note: d.note,
      kw: patch.kw || d.kw
    });
    for(var k in nw){ if(nw.hasOwnProperty(k)) d[k] = nw[k]; }
    state.tasks.forEach(function(t){ if(t.dept === no) t.deptTitle = d.title; });
    save(); renderAll();
    showToast(d.no + " " + d.title + " 부서 정보를 저장했습니다");
  }

  function deleteDept(no){
    var d = deptByNo(no);
    if(!d) return;
    if(DEPTS.length <= 1){ showToast("부서가 하나뿐이면 삭제할 수 없습니다"); return; }
    var cards = state.tasks.filter(function(t){ return t.dept === no; }).length;
    if(!window.confirm(d.no + " " + d.title + " 부서를 삭제합니다." + (cards ? "\n이 부서 카드 " + cards + "장과 소속 직원도 함께 지워집니다." : "") + "\n되돌릴 수 없습니다.")) return;
    DEPTS.splice(DEPTS.indexOf(d), 1);
    if(state.staff) delete state.staff[no];
    state.tasks = state.tasks.filter(function(t){ return t.dept !== no; });
    save(); renderAll();
    showToast(d.no + " " + d.title + " 부서를 삭제했습니다");

  /* 이 부서가 지금 일하고 있는가 — PC 진행 중 카드 우선, 없으면 진행 중 칸 카드 */
  function voLiveOf(no){
    var list = state.tasks.filter(function(t){
      return t.dept === no && t.pc && (t.pc.state === "sent" || t.pc.state === "running");
    }).sort(function(a, b){ return (b.pc.at || 0) - (a.pc.at || 0); });
    var more = list.length > 1 ? " · 외 " + (list.length - 1) + "건" : "";
    if(list.length){
      var t = list[0], p = t.pc;
      var idx = p.state === "sent" ? 0 : pcStageIdxOf(t);
      if(idx < 0 || idx > 4) idx = 0;
      return {
        label:(p.state === "sent" ? "PC 수신 대기" : VO_STAGE[idx]) + more,
        detail:(p.stageDetail || (p.state === "sent" ? "지시 받는 중…" : VO_STAGE_WAIT[idx])),
        sec:(Date.now() - (p.ackAt || p.at || Date.now())) / 1000,
        staffId:t.staffId || ""
      };
    }
    var doing = state.tasks.filter(function(t){ return t.dept === no && t.status === "doing"; })
      .sort(function(a, b){ return (b.statusAt || b.ts || 0) - (a.statusAt || a.ts || 0); });
    if(doing.length){
      var d = doing[0];
      return {
        label:"진행 중" + (doing.length > 1 ? " · 외 " + (doing.length - 1) + "건" : ""),
        detail:(d.title || "업무") + " 진행 중",
        sec:(Date.now() - (d.statusAt || d.ts || Date.now())) / 1000,
        staffId:d.staffId || ""
      };
    }
    return null;
  }

  function voClip(s, n){
    s = String(s == null ? "" : s).replace(/\s+/g, " ").trim();
    return s.length > n ? s.slice(0, n - 1) + "…" : s;
  }

  function renderOffice(){
    var floor = $("#officeFloor");
    if(!floor) return;
    floor.innerHTML = DEPTS.map(function(d){
      var list = staffOf(d.no);
      var seats = list.length
        ? list.map(function(s, k){
            return '<div class="vo-staff" data-staff="' + esc(s.id) + '">' +
              '<div class="vo-bubble" aria-hidden="true"></div>' +
              voSeatSVG(k) +
              '<div class="vo-tag"><b>' + esc(s.name) + '</b><span>' + esc(s.task || "담당 업무 미지정") + '</span></div>' +
            '</div>';
          }).join("")
        : '<div class="vo-empty">' + voEmptySVG() + '<b>빈 자리</b><span>부스를 눌러 직원을 추가하세요</span></div>';
      return '<article class="vo-booth" data-dept="' + esc(d.no) + '" data-cat="' + esc(d.cat) + '" tabindex="0" role="button" aria-haspopup="dialog" aria-label="' + esc(d.no + " " + d.title + " 부서 상세 열기") + '">' +
        '<div class="vo-head">' +
          '<span class="vo-no">' + esc(d.no) + '</span>' +
          '<div class="vo-name"><h3>' + esc(d.title) + '</h3><p>' + esc(d.one || "") + '</p></div>' +

        '</div>' +
      '</article>';
    }).join("") || '<div class="col-empty" style="grid-column:1/-1">부서가 없습니다 — 위의 <b>+ 부서 추가</b>로 만들어 주세요.</div>';

    var cnt = $("#deptCountAll"); if(cnt) cnt.textContent = DEPTS.length;
    var top = $("#deptCountTop"); if(top) top.textContent = DEPTS.length;

    $$(".vo-booth", floor).forEach(function(b){
      b.addEventListener("click", function(){ voOpen(b); });
      b.addEventListener("keydown", function(e){
        if(e.key === "Enter" || e.key === " "){ e.preventDefault(); voOpen(b); }
      });
    });
    voApplyFilter();
    voTick();

  function voOpen(b){
    var no = b.getAttribute("data-dept");
    for(var i = 0; i < DEPTS.length; i++){ if(DEPTS[i].no === no){ openDept(i); return; } }
  }

  function voApplyFilter(){
    var floor = $("#officeFloor");
    if(!floor) return;
    var act = $(".tab.is-active[data-filter]");
    var f = act ? act.getAttribute("data-filter") : "all";
    $$(".vo-booth", floor).forEach(function(b){
      b.classList.toggle("is-hidden", f !== "all" && b.getAttribute("data-cat") !== f);
    });
  }

  /* 1초마다 상태만 갱신 — 판(플로어)은 다시 그리지 않아 애니메이션이 끊기지 않습니다 */
  function voTick(){
    var floor = $("#officeFloor");
    if(!floor) return;
    var working = 0, idle = 0;
    $$(".vo-booth", floor).forEach(function(b){
      var live = voLiveOf(b.getAttribute("data-dept"));
      b.classList.toggle("is-working", !!live);
      if(live) working++; else idle++;
      var seats = $$(".vo-staff", b);
      seats.forEach(function(el, i){
        var on = !!live && (live.staffId ? el.getAttribute("data-staff") === live.staffId : i === 0);
        el.classList.toggle("is-active", on);
        var bub = $(".vo-bubble", el);
        if(bub) bub.textContent = on ? voClip(live.detail, 40) : "";
      });
      var sEl = $("[data-vo-status]", b);
      var cEl = $("[data-vo-clock]", b);
      if(sEl) sEl.textContent = live ? live.label : "지시 대기 중";
      if(cEl) cEl.textContent = live ? pcClock(live.sec) : "";
    });
    var wn = $("#voWorkingN"); if(wn && wn.textContent !== String(working)) wn.textContent = working;
    var inl = $("#voIdleN"); if(inl && inl.textContent !== String(idle)) inl.textContent = idle;
  }

  function normText(s){ return String(s == null ? "" : s).toLowerCase().replace(/\s+/g, " ").trim(); }

  /* 부서별 자동 배정 키워드 — 기본 9개 부서의 ROUTE + 대표님이 추가·수정한 키워드 */
  function routeTable(){
    var out = [];
    DEPTS.forEach(function(d){
      var base = null;
      for(var i=0;i<ROUTE.length;i++){ if(ROUTE[i].no === d.no){ base = ROUTE[i]; break; } }
      var kw = base ? base.kw.slice() : [];
      (d.kw || []).forEach(function(w){
        var s = String(w).toLowerCase().trim();
        if(s) kw.push([s, 4]);
      });
      out.push({ no:d.no, name:d.title, kw:kw });
    });
    return out;
  }

  function route(raw){
    var t = normText(raw);
    var table = routeTable();
    var scored = table.map(function(r){
      var s = 0, hits = [];
      for(var i=0;i<r.kw.length;i++){
        var k = r.kw[i];
        if(k[0] && t.indexOf(k[0]) > -1){
          s += k[1];
          if(hits.length < 3) hits.push(k[0]);
        }
      }
      if(s > RRI) s = RRI;
      return { no:r.no, score:s, hits:hits };
    }).sort(function(a,b){ return b.score - a.score || (a.no < b.no ? -1 : 1); });

    var top = scored[0], second = scored[1];
    if(!top || !top.score){
      var fb = deptByNo("04") ? "04" : (DEPTS[0] ? DEPTS[0].no : "01");
      return { depts:[{ no:fb, score:0, hits:[], why:"키워드 없음 — 기본 배정" }], fallback:true, near:null };
    }
    var out = [{ no:top.no, score:top.score, hits:top.hits, why:"" }];
    if(second && second.score >= 4 && second.score >= top.score * 0.6 && (top.score - second.score) >= 2){
      out.push({ no:second.no, score:second.score, hits:second.hits, why:"" });
    }
    return { depts:out, fallback:false, near:(second && second.score > 0) ? second : null };
  }

  /* 전 과정 실행(기본 꺼짐) — 예전처럼 걸린 부서 전부 + 04 취합 카드를 만들고,
     키워드가 없으면 04·07·09를 만듭니다. 대표님이 명시적으로 켰을 때만 씁니다. */
  function analyzeChain(raw){
    var t = normText(raw);
    var hit = {};
    routeTable().forEach(function(r){
      for(var i=0;i<r.kw.length;i++){
        if(r.kw[i][0] && t.indexOf(r.kw[i][0]) > -1){ hit[r.no] = true; break; }
      }
    });
    if(hit["01"]) hit["02"] = true;
    if(hit["08"] && (t.indexOf("진단") > -1 || t.indexOf("문의") > -1)) hit["06"] = true;
    if(deptByNo("04")) hit["04"] = true;
    var depts = Object.keys(hit).filter(function(d){ return deptByNo(d); }).sort();
    if(depts.length <= 1){
      depts = [];
      ["04","07","09"].forEach(function(no){ if(deptByNo(no)) depts.push(no); });
      if(!depts.length && DEPTS[0]) depts.push(DEPTS[0].no);
    }
    return depts.map(function(no){ return { no:no, score:0, hits:[], why:"전 과정 실행" }; });
  }

  function parseCtx(raw){
    var m = raw.match(/(\d+)\s*(편|건|개|회|장|명|곳|개소|만원|원)/);
    var channels = [];
    [["인스타","인스타"],["릴스","인스타"],["당근","당근"],["블로그","블로그"],["스레드","스레드"],["유튜브","유튜브"],["쇼츠","유튜브"],["틱톡","틱톡"],["카페","카페"]].forEach(function(p){
      if(raw.indexOf(p[0]) > -1 && channels.indexOf(p[1]) < 0) channels.push(p[1]);
    });
    return {
      raw: raw,
      n: m ? parseInt(m[1],10) : 0,
      unit: m ? m[2] : "",
      channels: channels
    };
  }

  /* 커스텀 부서용 기본 업무 템플릿 — 9개 기본 부서는 TPL 을 그대로 씁니다 */
  function tplFor(no){
    if(TPL[no]) return TPL[no];
    var d = deptByNo(no);
    if(!d) return null;
    return function(c){
      var outs = (d.outputs || []).filter(Boolean);
      var tools = (d.tools || []).filter(Boolean);
      var crit = outs.length ? (outs.slice(0, 3).join(" · ") + " 완성") : "결과 보고서 1장 완성";
      var prompt = "[" + d.no + " " + d.title + "] 실행 지시문\n" +
        "대표님 지시: \"" + String(c.raw || "").slice(0, 300) + "\"\n" +
        "이 부서 역할: " + (d.one || d.title) + "\n" +
        (tools.length ? "쓰는 툴: " + tools.join(", ") + "\n" : "") +
        "\n1. 대표님 지시에서 이 부서가 맡을 부분만 뽑아 범위를 한 줄로 확정\n" +
        "2. 맡은 일을 끝까지 실행하고, 막히면 이유와 대안을 같이 적기\n" +
        "3. 산출물: " + (outs.length ? outs.join(" · ") : "결과 보고서") + "\n" +
        "4. 결과는 마크다운으로 정리하고 대표님이 결정할 일만 남기기\n" +
        "\n완료 기준: " + crit + "\n지키는 선: 확인되지 않은 수치·보장 표현 금지, 대표님 승인 없는 발행·지출 금지.";
      return { title: d.title + " 업무 실행", criteria: crit, tools: tools.slice(0, 3), prompt: prompt };
    };
  }

  function makeTask(deptNo, ctx, rawInstr, staff){
    var d = deptByNo(deptNo);
    var tf = tplFor(deptNo);
    if(!d || !tf) return null;
    var t = tf(ctx);
    var st = staff || matchStaff(deptNo, rawInstr || ctx.raw)[0] || null;
    return {
      id: uid(), dept: d.no, deptTitle: d.title,
      title: t.title, criteria: t.criteria, tools: t.tools, prompt: t.prompt,
      instr: rawInstr || ctx.raw, status: "wait", ts: Date.now(),
      staffId: st ? st.id : "", staffName: st ? st.name : "",
      route: null, review: false
    };
  }

  /* 카드의 부서를 바꾸면 내용·직원·전송 역할 문구를 통째로 다시 만듭니다 */
  function retargetTask(id, no){
    var t = findTask(id), d = deptByNo(no);
    if(!t || !d) return;
    if(t.pc && (t.pc.state === "sent" || t.pc.state === "running")){
      showToast("PC로 보낸 카드는 결과가 올 때까지 부서를 바꿀 수 없습니다");
      renderBoard();
      return;
    }
    var from = t.dept, hadPc = !!t.pc;
    var nw = makeTask(no, parseCtx(t.instr || ""), t.instr || "", null);
    if(!nw){ showToast("이 부서로는 카드를 만들 수 없습니다"); renderBoard(); return; }
    t.dept = nw.dept; t.deptTitle = nw.deptTitle;
    t.title = nw.title; t.criteria = nw.criteria; t.tools = nw.tools; t.prompt = nw.prompt;
    t.staffId = nw.staffId; t.staffName = nw.staffName;
    t.route = { mode:"manual", score:0, hits:[], why:"직접 변경 " + from + " → " + no, near:"" };
    if(hadPc) t.pc = null;
    save(); renderAll();
    showToast(from + " → " + no + " " + d.title + " 부서로 바꿨습니다" + (hadPc ? " — 이전 부서 실행 기록은 지웠습니다" : ""));
  }

  /* ================= 렌더: 보드 ================= */
  function countBy(key){
    var n = 0;
    state.tasks.forEach(function(t){ if(t.status === key) n++; });
    return n;
  }

  function routeLabel(t){
    var r = t.route;
    var d = deptByNo(t.dept);
    var name = d ? (d.no + " " + d.title) : (t.dept + " " + t.deptTitle);
    if(!r) return '<div class="t-route"><b>배정</b><span>' + esc(name) + '</span></div>';
    var why = (r.hits && r.hits.length) ? r.hits.join("·") : (r.why || "");
    var isMove = r.mode === "manual" && String(r.why || "").indexOf("직접 변경") === 0;
    return '<div class="t-route' + (r.mode === "manual" ? " is-manual" : "") + '">' +
      "<b>" + (r.mode === "manual" ? (isMove ? "변경" : "직접") : "배정") + "</b>" +
      "<span>" + esc(name) + "</span>" +
      (r.mode === "manual" ? "" : "<em>점수 " + (r.score || 0) + "</em>") +
      (why ? "<span>· " + esc(why) + "</span>" : "") +
      "</div>";
  }

  var CARET = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>';

  function renderBoard(){
    var grid = $("#boardGrid");
    if(!grid) return;
    var html = "";
    STATUS.forEach(function(s){
      var list = state.tasks.filter(function(t){ return t.status === s.key; }).sort(function(a,b){ return b.ts - a.ts; });
      html += '<div class="col" data-status="' + s.key + '">' +
        '<div class="col-head"><i></i>' + s.label + '<span class="col-count">' + list.length + '</span></div>';
      if(!list.length){
        html += '<div class="col-empty">' + s.empty + '</div>';
      } else {
        list.forEach(function(t){
          var ci = CYCLE.indexOf(t.status);
          var nk = CYCLE[(ci + 1) % CYCLE.length];
          var nextLabel = statusOf(nk).label;
          var nextIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>';
          var sName = staffNameOf(t);
          var slist = staffOf(t.dept);
          var cur = t.staffId || "";
          var known = cur && !!findStaff(t.dept, cur);
          var opts = '<option value=""' + (cur === "" ? " selected" : "") + '>미배정</option>' + slist.map(function(st){
            return '<option value="' + esc(st.id) + '"' + (st.id === cur ? " selected" : "") + '>' + esc(st.name) + '</option>';
          }).join("");
          if(cur && !known){
            opts += '<option value="' + esc(cur) + '" selected>' + esc((t.staffName || "삭제된 직원") + " (삭제됨)") + '</option>';
          }
          var locked = !!(t.pc && (t.pc.state === "sent" || t.pc.state === "running"));
          var deptOpts = DEPTS.map(function(d){ return '<option value="' + d.no + '"' + (d.no === t.dept ? " selected" : "") + '>' + d.no + " " + esc(d.title) + '</option>'; }).join("");
          var runLabel = locked ? "⏳ 작업 중" : (t.pc && (t.pc.state === "done" || t.pc.state === "error")) ? "↻ 다시 실행" : "▶ PC 실행";

          html += '<article class="task" data-id="' + t.id + '" data-st="' + t.status + '">' +
            '<div class="task-top">' +
              '<span class="t-no">' + esc(t.dept) + '</span>' +
              '<span class="t-dept-pick' + (locked ? " is-locked" : "") + '" title="' + (locked ? "PC가 결과를 돌려줄 때까지는 부서를 바꿀 수 없습니다" : "부서 바꾸기") + '">' +
                '<span>' + esc(t.deptTitle) + '</span>' + CARET +
                '<select class="t-dept-sel" data-dept-sel aria-label="부서 변경"' + (locked ? " disabled" : "") + '>' + deptOpts + '</select>' +
              '</span>' +
              '<button class="t-del" type="button" data-act="del" aria-label="카드 삭제">×</button>' +
            '</div>' +
            routeLabel(t) +

  /* 오늘의 지휘 현황 — 헤더 아래 얇은 상태 바 1줄 */

  /* ================= 결과 보고함 + 결과 섹션 파싱 ================= */
  var resFilter = "all";
  var resSel = "";
  var resSec = "report";
  var RES_SEEN = "vision_console_results_seen_v1";
  var resSeen = {};
  var RES_STATE = { done:{label:"✅ 완료", chip:"chip-done"}, review:{label:"👀 검수 대기", chip:"chip-review"}, error:{label:"❌ 오류", chip:"chip-error"} };
  var RES_SECTIONS = [
    { key:"assign",   title:"비서 배정 판단",    short:"배정",   re:/^#{2,4}\s*비서\s*배정\s*판단/ },
    { key:"works",    title:"직원별 작업 결과",  short:"직원별", re:/^#{2,4}\s*직원별\s*(작업\s*)?결과/ },
    { key:"insights", title:"직원 간 인사이트 공유", short:"인사이트", re:/^#{2,4}\s*직원\s*간\s*인사이트/ },
    { key:"confirm",  title:"비서 컨펌 결과",    short:"컨펌",   re:/^#{2,4}\s*비서\s*컨?펌/ },
    { key:"report",   title:"대표님 최종 보고",  short:"최종 보고", re:/^#{2,4}\s*대표님\s*최종\s*보고/ }
  ];
  var RES_TITLE = {};
  RES_SECTIONS.forEach(function(s){ RES_TITLE[s.key] = s.title; });

  function resLoadSeen(){
    try{
      var raw = localStorage.getItem(RES_SEEN);
      var s = raw ? JSON.parse(raw) : null;
      resSeen = (s && typeof s === "object") ? s : {};
    }catch(e){ resSeen = {}; }
  }
  function resSaveSeen(){ try{ localStorage.setItem(RES_SEEN, JSON.stringify(resSeen)); }catch(e){} }

  function resSig(t){ return String((t.pc && (t.pc.doneAt || t.pc.at)) || t.ts || 0); }
  function resHasBody(t){ return !!(t.pc && t.pc.text); }
  function resInbox(){
    return state.tasks.filter(function(t){
      if(t.status !== "done" && t.status !== "review" && t.status !== "error") return false;
      return resHasBody(t) || t.status === "review";
    }).sort(function(a, b){
      var av = (a.pc && (a.pc.doneAt || a.pc.at)) || a.ts || 0;
      var bv = (b.pc && (b.pc.doneAt || b.pc.at)) || b.ts || 0;
      return bv - av;
    });
  }
  function resUnread(){
    return resInbox().filter(function(t){ return resSeen[t.id] !== resSig(t); }).length;
  }

  function resStamp(t){
    var d = new Date((t.pc && (t.pc.doneAt || t.pc.at)) || t.ts || Date.now());
    function p(n){ return (n < 10 ? "0" : "") + n; }
    return d.getFullYear() + "." + p(d.getMonth() + 1) + "." + p(d.getDate()) + " " + p(d.getHours()) + ":" + p(d.getMinutes());
  }
  function resFileStamp(t){
    var d = new Date((t.pc && (t.pc.doneAt || t.pc.at)) || t.ts || Date.now());
    function p(n){ return (n < 10 ? "0" : "") + n; }
    return "" + d.getFullYear() + p(d.getMonth() + 1) + p(d.getDate()) + "-" + p(d.getHours()) + p(d.getMinutes());
  }

  function resMarkSeen(t){

  /* 결과 본문의 5개 섹션 파싱 — 일반 텍스트 결과도 그대로 통과 */
  function parseResult(text){
    var src = String(text == null ? "" : text).replace(/\r/g, "");
    var out = { full: src, has: false, order: [], map: {} };
    var cur = "other";
    out.map.other = [];
    src.split("\n").forEach(function(line){
      var hit = null, tr = line.replace(/^\s+/, "").replace(/\s+$/, "");
      for(var i = 0; i < RES_SECTIONS.length; i++){
        if(RES_SECTIONS[i].re.test(tr)){ hit = RES_SECTIONS[i]; break; }
      }
      if(hit){
        cur = hit.key;
        if(!out.map[cur]) out.map[cur] = [];
        if(out.order.indexOf(cur) < 0) out.order.push(cur);
        out.has = true;
        return;
      }
      out.map[cur].push(line);
    });
    var k;
    for(k in out.map){ if(out.map.hasOwnProperty(k)) out.map[k] = out.map[k].join("\n").replace(/^\s*\n+/, "").replace(/\s+$/, ""); }
    return out;
  }

  function splitBlocks(text){
    var blocks = [], cur = null;
    String(text || "").split("\n").forEach(function(l){
      var m = l.match(/^\s*#{3,5}\s+(.+)$/);
      if(m){
        cur = { title: m[1].replace(/[*#]/g, "").trim(), lines: [] };
        blocks.push(cur);
      } else {
        if(!cur){ cur = { title:"", lines:[] }; blocks.push(cur); }
        cur.lines.push(l);
      }
    });
    return blocks.filter(function(b){ return b.title || b.lines.join("").trim(); });
  }

  function insRows(text){
    return String(text || "").split("\n").map(function(l){ return l.replace(/^\s*[-*•]\s*/, "").trim(); }).filter(Boolean).map(function(l){
      var m = l.match(/^([^:：]{2,18})\s*[:：]\s*(.+)$/);
      return m ? { who:m[1].replace(/\*\*/g, ""), what:m[2] } : { who:"", what:l };
    });
  }

  /* 보고 본문 렌더 — 제목·볼드·목록·마크다운 표를 HTML로. 텍스트는 먼저 esc로 막아 XSS를 막습니다. */
  function mdInline(s){
    return esc(String(s == null ? "" : s)).replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>");
  }
  function mdRow(line){
    return String(line == null ? "" : line).trim().replace(/^\|/, "").replace(/\|$/, "").split("|").map(function(c){ return c.trim(); });
  }
  function mdSep(line){
    var s = String(line == null ? "" : line).trim();
    if(s.indexOf("|") < 0) return false;
    var cells = mdRow(s);
    if(!cells.length) return false;
    return cells.every(function(c){ return /^:?-{2,}:?$/.test(c.replace(/\s/g, "")); });
  }
  function mdTableHTML(lines){
    var head = mdRow(lines[0]);
    var rows = lines.slice(2).map(mdRow).filter(function(r){ return r.join("").replace(/\s/g, "") !== ""; });
    var w = head.length;
    var h = '<div class="hr-table-wrap"><table class="hr-table"><thead><tr>';
    head.forEach(function(c){ h += "<th>" + mdInline(c) + "</th>"; });
    h += "</tr></thead><tbody>";
    rows.forEach(function(r){
      h += "<tr>";
      for(var i = 0; i < w; i++) h += "<td>" + mdInline(r[i] || "") + "</td>";
      h += "</tr>";
    });
    return h + "</tbody></table></div>";
  }
  function reportDocHTML(text){
    var lines = String(text == null ? "" : text).replace(/\r/g, "").split("\n");
    var out = [], list = false;
    function closeList(){ if(list){ out.push("</ul>"); list = false; } }
    for(var i = 0; i < lines.length; i++){
      var t = lines[i].replace(/^\s+/, "").replace(/\s+$/, "");
      if(!t){ closeList(); continue; }
      /* 마크다운 표: 한 줄에 | 가 있고 바로 다음 줄이 | --- | --- | 이면 표로 */
      if(t.indexOf("|") > -1 && i + 1 < lines.length && mdSep(lines[i + 1])){
        var block = [lines[i], lines[i + 1]];
        var j = i + 2;
        while(j < lines.length && lines[j].replace(/\s/g, "") && lines[j].indexOf("|") > -1){ block.push(lines[j]); j++; }
        closeList();
        out.push(mdTableHTML(block));
        i = j - 1;
        continue;
      }
      var h = t.match(/^#{2,5}\s*(.+)$/);
      if(h){ closeList(); out.push("<h4>" + mdInline(h[1].replace(/[*#]/g, "")) + "</h4>"); continue; }
      var b = t.match(/^[-*•·]\s+(.+)$/);
      if(b){ if(!list){ out.push("<ul>"); list = true; } out.push("<li>" + mdInline(b[1]) + "</li>"); continue; }
      var n = t.match(/^([①-⑳]|\d{1,2}[.)])\s*(.+)$/);
      if(n && n[2]){ closeList(); out.push('<div class="hr-item"><i>' + esc(n[1]) + '</i><span>' + mdInline(n[2]) + '</span></div>'); continue; }
      closeList();
      out.push("<p>" + mdInline(t) + "</p>");
    }
    closeList();
    return out.join("") || '<p style="color:#8b9dae">본문이 비어 있습니다.</p>';
  }

  function resSectionHTML(text, key, compact){
    var body = String(text || "").trim();
    if(!body) return '<div class="rp-mini">이 섹션은 결과에 없습니다.</div>';
    if(key === "report") return '<div class="hr-doc">' + reportDocHTML(body) + '</div>';
    if(key === "insights"){
      var rows = insRows(body);
      if(rows.length > 1 || rows[0].who){
        return '<div class="ins-list">' + rows.map(function(r){
          return '<div class="ins-row">' + (r.who ? '<b>' + esc(r.who) + '</b>' : '<b>공유</b>') + '<span>' + esc(r.what) + '</span></div>';
        }).join("") + '</div>';
      }
    }
    if(key === "works"){
      var blocks = splitBlocks(body);
      if(blocks.length > 1 || (blocks[0] && blocks[0].title)){
        return blocks.map(function(b){
          return '<div class="rp-block">' + (b.title ? '<h5><i></i>' + esc(b.title) + '</h5>' : "") +
            '<pre>' + esc(b.lines.join("\n").trim()) + '</pre></div>';
        }).join("");
      }
    }
    return '<pre' + (compact ? ' style="min-height:0;max-height:230px"' : '') + '>' + esc(body) + '</pre>';
  }

  function resTabsHTML(parsed, view, attr){
    if(!parsed.has) return "";
    var keys = [{ k:"full", t:"전체" }].concat(parsed.order.map(function(k){ return { k:k, t:RES_TITLE[k] || k }; }));
    return keys.map(function(o){
      return '<button type="button" ' + attr + '="' + o.k + '" class="' + (view === o.k ? "is-on" : "") + '">' + esc(o.t) + '</button>';
    }).join("");
  }

  /* 보드 카드 안의 결과 — 5개 섹션을 작은 탭으로 */
  function cardOutHTML(t){
    var p = t.pc || {};
    var parsed = parseResult(p.text || "");
    var view = p.view || (parsed.map.report ? "report" : "full");
    if(view !== "full" && !parsed.map[view]) view = "full";
    var compactTabs = "";
    if(parsed.has){
      var keys = resKeyList(parsed).map(function(k){
        if(k === "full") return { k:k, t:"전체" };
        var s = null;
        for(var i = 0; i < RES_SECTIONS.length; i++){ if(RES_SECTIONS[i].key === k) s = RES_SECTIONS[i]; }
        return { k:k, t:(s ? s.short : k) };
      });
      compactTabs = '<div class="t-pc-secs">' + keys.map(function(o){
        return '<button type="button" data-act="pcsec" data-sec="' + o.k + '" class="' + (view === o.k ? "is-on" : "") + '">' + esc(o.t) + '</button>';
      }).join("") + '</div>';
    }
    var bodyHTML;
    if(view === "full" || !parsed.has){
      bodyHTML = '<pre>' + esc(String(p.text || "").trim()) + '</pre>';
    } else {
      bodyHTML = resSectionHTML(parsed.map[view], view, true);
    }
    return '<div class="t-pc-out"><div class="t-pc-out-head">클로드 코드 결과' + (parsed.has ? " · 5단계 보고" : "") +
      '<button type="button" data-act="pccopy">복사</button></div>' + compactTabs + bodyHTML + '</div>';
  }

  /* 섹션 탭 순서 — 대표님 최종 보고가 항상 맨 앞, 원문은 맨 뒤 */
  function resKeyList(parsed){
    var keys = [];
    if(parsed.map.report) keys.push("report");
    parsed.order.forEach(function(k){ if(k !== "report" && keys.indexOf(k) < 0) keys.push(k); });
    keys.push("full");
    return keys;
  }

  function resPanel(t){

    return '<article class="res-panel">' +

      '<div class="rp-instr"><i>대표님 지시</i>' + esc(t.instr || "—") + '</div>' +
      '<div class="rp-meta">' +
        '<div><dt>완료 시각</dt><dd>' + esc(resStamp(t)) + '</dd></div>' +

        (t.status === "review" ? '<button class="btn ok" type="button" data-resact="approve">승인 (완료로)</button><button class="btn no" type="button" data-resact="reject">반려 (대기로)</button>' : "") +
        '<button class="btn btn-primary" type="button" data-resact="copy"' + (body ? "" : " disabled") + '>보고서 복사</button>' +
        '<button class="btn btn-ghost" type="button" data-resact="md"' + (body ? "" : " disabled") + '>.md로 저장</button>' +
        '<button class="btn btn-ghost go" type="button" data-resact="board">보드에서 보기</button>' +
      '</div>' +
      '</article>';
  }

  function renderResults(){
    var list = $("#resList"), det = $("#resDetail");
    if(!list || !det) return;
    var all = resInbox();
    var counts = { all:all.length, review:0, done:0, error:0 };
    all.forEach(function(t){ if(counts[t.status] != null) counts[t.status]++; });
    $$("#resTabs .tab").forEach(function(b){
      var f = b.getAttribute("data-resfilter");
      var num = $("b", b);
      if(num) num.textContent = counts[f] || 0;
      var on = f === resFilter;
      b.classList.toggle("is-active", on);
      b.setAttribute("aria-selected", on ? "true" : "false");
    });
    var items = resFilter === "all" ? all : all.filter(function(t){ return t.status === resFilter; });
    if(!items.length){
      list.innerHTML = '<div class="res-empty"><b>' + (resFilter === "all" ? "아직 도착한 결과가 없습니다" : "이 칸에 해당하는 결과가 없습니다") + '</b>' +
        (resFilter === "all"
          ? "카드에서 <b>▶ PC 실행</b>으로 보내면, 클로드 코드가 끝낸 결과 본문이 이곳에 쌓입니다."
          : "다른 필터를 눌러 전체 결과를 확인해 보세요.") + '</div>';
    } else {
      list.innerHTML = items.map(function(t){
        var st = RES_STATE[t.status] || RES_STATE.done;

    try{

      var url = URL.createObjectURL(blob);

      setTimeout(function(){ try{ URL.revokeObjectURL(url); }catch(e){} if(a.parentNode) a.parentNode.removeChild(a); }, 2000);

      box.innerHTML = live ? heroLiveHTML(live, null) : heroEmptyHTML();

      box.innerHTML = heroLiveHTML(live, t);
      return;
    }
    heroStageId = live ? live.id : "";

  (function bindHeroReport(){
    var root = $("#heroReport");
    if(!root) return;
    root.addEventListener("click", function(e){
      if(!e.target.closest) return;
      var nav = e.target.closest("[data-hrnav]");
      if(nav){
        var list = resInbox();
        if(!list.length) return;
        var cur = 0;
        for(var i = 0; i < list.length; i++){ if(list[i].id === heroSel) cur = i; }
        var step = nav.getAttribute("data-hrnav") === "prev" ? 1 : -1;
        heroSel = list[(cur + step + list.length) % list.length].id;
        heroAux = "report";
        renderHeroReport();
        return;
      }
      var liveBtn = e.target.closest("[data-hrlive]");
      if(liveBtn){ heroSel = ""; heroAux = "report"; renderHeroReport(); return; }
      var pick = e.target.closest("[data-hrview]");
      if(pick){ heroSel = pick.getAttribute("data-hrview") || ""; heroAux = "report"; renderHeroReport(); return; }
      var tab = e.target.closest("[data-hraux]");
      if(tab){ heroAux = tab.getAttribute("data-hraux") || "report"; renderHeroReport(); return; }
      var act = e.target.closest("[data-hract]");
      if(!act) return;
      var t = heroSel ? findTask(heroSel) : resInbox()[0];
      if(!t) return;
      var kind = act.getAttribute("data-hract");
      if(kind === "copy"){ copyText(heroViewText(t)); }
      else if(kind === "md"){ resDownload(t); }
      else if(kind === "approve"){ resMarkSeen(t); approveTask(t.id); }
      else if(kind === "reject"){ resMarkSeen(t); rejectTask(t.id); }
    });
    root.addEventListener("change", function(e){
      if(!e.target.closest) return;
      var sel = e.target.closest("[data-hrpick]");
      if(!sel) return;
      heroSel = sel.value || "";
      heroAux = "report";
      renderHeroReport();
    });
  })();
